<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swift Concurrency Lecture</title>
<style>
:root {
  --bg: #f6f5f1; --fg: #14161b; --muted: #5a6170; --card: #ffffff; --card2: #efede7; --line: #d6d2c8;
  --accent: #f05138; --accent-soft: #fde5df;
  --main: #15994a; --main-soft: #dcf3e4;
  --bgc: #2563eb; --bgc-soft: #dde7fd;
  --actor: #8b4fe0; --actor-soft: #ece2fb;
  --err: #d92d2d; --err-soft: #fbe0e0;
  --warn: #e07012; --warn-soft: #fde9d6;
  --idle: #9aa1ad; --idle-soft: #e7e7ea;
  --tA: #f59e0b; --tB: #0ea5a4; --tC: #e2489b;
  --code-bg: #1c2130; --code-fg: #e9edf4;
  --shadow: 0 2px 10px rgba(20,22,27,.08);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1217; --fg: #eef1f6; --muted: #a0a8b6; --card: #181c25; --card2: #1f2430; --line: #2d3442;
  --accent-soft: #3a1f1a; --main: #34c46c; --main-soft: #15301f; --bgc: #5b8cff; --bgc-soft: #1a2747;
  --actor: #a87cf0; --actor-soft: #2a1f42; --err: #f05454; --err-soft: #3d1a1a; --warn: #f59a42; --warn-soft: #3b2614;
  --idle: #6b7280; --idle-soft: #262b35; --code-bg: #141824; --shadow: 0 2px 10px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif; color: var(--fg); }
code, pre, .mono { font-family: "SF Mono", ui-monospace, Menlo, Monaco, "Cascadia Mono", Consolas, monospace; }
button { font: inherit; color: inherit; }
a { color: var(--bgc); }

/* ------------------------------------------------ stage */
#stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: center; background: var(--bg); overflow: hidden; }
.frame { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 44px 72px 0; }
.frame > header { display: flex; align-items: flex-end; gap: 24px; min-height: 96px; }
.frame > header .titles { flex: 1; min-width: 0; }
.kicker { font-size: 20px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.frame h1 { font-size: 52px; line-height: 1.1; margin: 6px 0 0; font-weight: 750; letter-spacing: -.01em; }
.frame h1 code { font-size: .9em; background: var(--card2); padding: 0 .2em; border-radius: 8px; }
.badge { display: inline-block; font-size: 18px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--card2); color: var(--muted); vertical-align: middle; margin-left: 14px; letter-spacing: 0; text-transform: none; }
.ia-tab { font-size: 19px; font-weight: 650; border: 2px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 8px 18px; cursor: pointer; white-space: nowrap; }
.ia-tab.on { background: var(--accent); color: #fff; }
.content { flex: 1; min-height: 0; overflow: hidden; font-size: calc(30px * var(--k, 1)); line-height: 1.38; padding-top: .55em; }
.content > :first-child { margin-top: 0; }
.content p { margin: .45em 0; }
.content ul, .content ol { margin: .35em 0; padding-left: 1.25em; }
.content li { margin: .22em 0; }
.content li::marker { color: var(--accent); font-weight: 700; }
.content strong { font-weight: 720; }
.content code, .notes code, .demo code, .ia code { font-size: .86em; background: var(--card2); padding: .05em .28em; border-radius: .25em; }
.content table { border-collapse: collapse; font-size: .82em; margin: .4em 0; background: var(--card); box-shadow: var(--shadow); border-radius: 12px; overflow: hidden; }
.content th, .content td { text-align: left; padding: .42em .8em; border-bottom: 1px solid var(--line); vertical-align: top; }
.content th { background: var(--card2); font-weight: 700; }
.content tr:last-child td { border-bottom: 0; }
.content blockquote { margin: .5em 0; padding: .3em .9em; border-left: 6px solid var(--accent); background: var(--card); }
pre.code { margin: .45em 0; padding: .7em .9em; border-radius: 14px; background: var(--code-bg); color: var(--code-fg); font-size: .8em; line-height: 1.42; overflow: hidden; white-space: pre; box-shadow: var(--shadow); }
pre.code code { background: none !important; padding: 0 !important; font-size: 1em !important; color: inherit; }
pre.code .ln { display: inline-block; min-width: 100%; border-radius: 4px; }
.tk-kw { color: #ff7ab2; font-weight: 600; } .tk-ty { color: #6bdcff; } .tk-str { color: #ff8170; } .tk-com { color: #9fb0c4; }
.tk-num { color: #d9c97c; } .tk-attr { color: #ffa14f; } .tk-fn { color: #78e0c6; } .tk-mac { color: #ffa14f; }
.content.cols { display: grid; grid-template-columns: fit-content(64%) minmax(0, 1fr); column-gap: 1.1em; align-items: start; }
.content.cols > .col { min-width: 0; }
.content.cols > .col > :first-child { margin-top: 0; }

.frame > footer { height: 64px; display: flex; align-items: center; gap: 20px; color: var(--muted); font-size: 17px; }
.frame > footer .track { flex: 1; }
.frame > footer .fid { font-weight: 650; min-width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
.ia { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 16px; font-size: 24px; }
.ia[hidden], .content[hidden] { display: none; }
.navbtn { position: absolute; bottom: 14px; width: 44px; height: 36px; border: 0; background: transparent; color: var(--muted); font-size: 24px; cursor: pointer; opacity: .35; }
.navbtn:hover { opacity: 1; }

/* ------------------------------------------------ agenda track (A1) */
.track { display: flex; gap: 4px; height: 30px; position: relative; }
.tseg { position: relative; height: 100%; border-radius: 6px; background: var(--card2); cursor: pointer; overflow: visible; }
.tseg .tfill { position: absolute; inset: 0; border-radius: 6px; background: var(--accent); opacity: .22; transform-origin: left; }
.tseg.done .tfill { opacity: .35; }
.tseg.future .tfill { opacity: 0; }
.tseg.cur { outline: 2px solid var(--accent); }
.tseg .tlabel { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 8px; font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; color: var(--muted); }
.tseg.cur .tlabel { color: var(--fg); }
.tneedle { position: absolute; top: -5px; bottom: -5px; width: 4px; margin-left: -2px; background: var(--accent); border-radius: 2px; pointer-events: none; }
.track.big { height: 96px; gap: 8px; }
.track.big .tseg { border-radius: 12px; }
.track.big .tseg .tfill { border-radius: 12px; opacity: .14; }
.track.big .tlabel { align-items: flex-start; flex-direction: column; justify-content: center; font-size: 17px; white-space: normal; line-height: 1.15; padding: 0 12px; color: var(--fg); }
.track.big .tlabel small { color: var(--muted); font-weight: 500; font-size: 14px; }

/* ------------------------------------------------ special slides */
.frame.title-slide { justify-content: center; padding: 0 120px; }
.title-slide .bgsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-slide .tcontent { position: relative; }
.title-slide .tcontent .k { font-size: 26px; font-weight: 650; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.title-slide .tcontent h1 { font-size: 112px; margin: 16px 0 10px; letter-spacing: -.02em; }
.title-slide .tcontent .sub { font-size: 40px; color: var(--muted); max-width: 1100px; }
.title-slide .tcontent .who { font-size: 28px; margin-top: 48px; font-weight: 600; }
.cards6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6em; }
.cards6 .c { background: var(--card); border-radius: 16px; padding: .7em .85em; box-shadow: var(--shadow); border-top: 6px solid var(--err); font-size: .82em; }
.cards6 .c b { display: block; font-size: 1.15em; margin-bottom: .25em; }
.cards6 .c:nth-child(2) { border-top-color: var(--warn); }
.cards6 .c:nth-child(n+3) { border-top-color: var(--idle); }

/* ------------------------------------------------ demo card (A22) */
.frame.demo { background: linear-gradient(135deg, var(--bg) 60%, var(--accent-soft)); }
.demo-pill { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: #fff; font-weight: 800; font-size: 26px; padding: 8px 20px; border-radius: 999px; letter-spacing: .02em; }
.ps-banner { display: inline-block; margin-left: 14px; font-size: 20px; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 2px dashed var(--accent); color: var(--accent); vertical-align: middle; }
.demo-body { flex: 1; min-height: 0; padding-top: 22px; }
.demo-left { min-height: 0; overflow: hidden; font-size: calc(26px * var(--k, 1)); }
.demo-file { background: var(--card); border-radius: 16px; padding: .6em .9em; box-shadow: var(--shadow); line-height: 1.45; }
.demo-file .lbl { font-size: .7em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; display: block; margin-bottom: .15em; }
.demo-file code.path { cursor: copy; background: var(--card2); }
.demo-file code.path.copied { background: var(--main-soft); }
.demo-hint { font-size: .66em; color: var(--muted); margin-top: .4em; }
.kbd { display: inline-block; border: 1.5px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 0 .35em; font-weight: 650; background: var(--card); color: var(--fg); }
.concepts { margin-top: .7em; width: 100%; border-collapse: collapse; background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); font-size: .8em; }
.concepts th { text-align: left; font-size: .72em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--card2); padding: .5em .8em; }
.concepts td { padding: .45em .8em; border-top: 1px solid var(--line); vertical-align: top; }
.concepts td:first-child { width: 42%; }
.slink { display: inline-block; font-weight: 750; font-size: .85em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .05em .55em; margin: .05em .15em .05em 0; cursor: pointer; border: 0; }
.slink:hover { background: var(--accent); color: #fff; }

/* ------------------------------------------------ interactive building blocks */
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
.btn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 18px; font-size: 21px; font-weight: 650; cursor: pointer; box-shadow: var(--shadow); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .35; cursor: default; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 8px 16px; font-size: 20px; font-weight: 650; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--fg); color: var(--bg); }
.seglbl { font-size: 17px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
.stat { font-size: 22px; color: var(--muted); font-weight: 600; }
.stat b { font-size: 34px; color: var(--fg); font-variant-numeric: tabular-nums; }
.caption { font-size: 22px; color: var(--muted); margin-top: 10px; min-height: 1.4em; }
.panel { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 18px; }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 4px 10px; font-weight: 700; font-size: 19px; color: #fff; background: var(--bgc); white-space: nowrap; }
.chip.main { background: var(--main); } .chip.actor { background: var(--actor); } .chip.err { background: var(--err); } .chip.idle { background: var(--idle); }
.chip.ghost { background: transparent; color: var(--muted); border: 2px dashed var(--line); }
.lanes { display: flex; flex-direction: column; gap: 8px; }
.lane { display: flex; align-items: center; gap: 12px; }
.lane .lname { width: 170px; font-size: 19px; font-weight: 650; color: var(--muted); text-align: right; flex: none; }
.lane .ltrack { flex: 1; height: 44px; border-radius: 10px; background: var(--card2); position: relative; display: flex; align-items: center; padding: 0 6px; gap: 6px; overflow: hidden; transition: background .2s; }
.lane.main .ltrack { box-shadow: inset 5px 0 0 var(--main); }
.lane.bg .ltrack { box-shadow: inset 5px 0 0 var(--bgc); }
.lane.actorl .ltrack { box-shadow: inset 5px 0 0 var(--actor); }
.lane.blocked .ltrack { background: var(--idle-soft); }
.lane.red .ltrack { background: var(--err-soft); box-shadow: inset 0 0 0 3px var(--err); }
.lane.new .lname { color: var(--err); }
.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.shake { animation: shake .45s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.grow { flex: 1; min-height: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.ok { color: var(--main); font-weight: 700; } .bad { color: var(--err); font-weight: 700; }
.msg { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 19px; background: var(--err-soft); color: var(--err); border-left: 5px solid var(--err); padding: 8px 12px; border-radius: 8px; }
.msg.okm { background: var(--main-soft); color: var(--main); border-left-color: var(--main); font-family: inherit; }

/* timeline (S4, S16) */
.tl { position: relative; }
.tl .ltrack { height: 54px; padding: 0; }
.tl-block { position: absolute; top: 5px; bottom: 5px; border-radius: 6px; color: #fff; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center; transform-origin: left; transition: transform .3s linear, opacity .2s; border-right: 2px solid var(--card2); }
.tl-block.hide { transform: scaleX(0); }
.tl-axis { display: flex; margin-left: 182px; font-size: 16px; color: var(--muted); position: relative; height: 24px; }
.tl-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-cursor { position: absolute; top: 0; bottom: 24px; width: 3px; background: var(--fg); opacity: 0; pointer-events: none; }
.pbar { position: absolute; left: 0; top: 6px; bottom: 6px; border-radius: 6px; background: var(--bgc); width: 0; }
.pbar.mainc { background: var(--main); }

/* destinations (S27) */
.dest { height: 92px; border-radius: 16px; margin-bottom: 14px; display: flex; align-items: center; padding: 0 22px; font-weight: 750; font-size: 24px; border: 3px solid transparent; transition: all .25s; }
.dest.main { background: var(--main-soft); color: var(--main); } .dest.bg { background: var(--bgc-soft); color: var(--bgc); } .dest.actor { background: var(--actor-soft); color: var(--actor); }
.dot { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(240,81,56,.25); transition: left .7s cubic-bezier(.5,0,.3,1), top .7s cubic-bezier(.5,0,.3,1), background .3s; z-index: 5; pointer-events: none; }

/* task group (S17) */
.tg { display: grid; grid-template-columns: minmax(0, 1fr) 640px; gap: 22px; flex: 1; min-height: 0; }
.gbox { border: 3px solid var(--fg); border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.gbox .queue { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; }
.lchip { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 8px; background: var(--bgc-soft); overflow: hidden; display: flex; align-items: center; padding-left: 10px; font-weight: 700; font-size: 19px; }
.lchip i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bgc); opacity: .55; }
.lchip span { position: relative; }
.results { display: flex; flex-wrap: wrap; gap: 6px; font-size: 22px; }
.brace { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 22px; margin-top: 8px; }

/* tree (S18) */
.tree { position: relative; flex: 1; min-height: 0; }
.tree svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tree line { stroke: var(--line); stroke-width: 4; }
.tnode { position: absolute; transform: translate(-50%, -50%); background: var(--card); border: 3px solid var(--main); border-radius: 14px; padding: 8px 12px 8px 16px; font-weight: 700; font-size: 21px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); white-space: nowrap; transition: border-color .2s, background .2s; }
.tnode .st { font-size: 14px; font-weight: 600; color: var(--main); }
.tnode.cancelled { border-color: var(--err); background: var(--err-soft); }
.tnode.cancelled .st, .tnode.error .st { color: var(--err); }
.tnode.error { border-color: var(--err); background: var(--err); color: #fff; }
.tnode.error .st { color: #fff; }
.tnode.loose { border-style: dashed; }
.tnode button { border: 0; background: var(--card2); border-radius: 8px; width: 34px; height: 32px; cursor: pointer; font-size: 17px; }

/* race (S21) */
.race { display: grid; grid-template-columns: 1fr 300px 1fr; gap: 24px; align-items: start; }
.thr { text-align: center; }
.thr h3 { margin: 0 0 8px; font-size: 26px; }
.thr .reg { font-size: 20px; color: var(--muted); margin: 6px 0 10px; font-family: "SF Mono", ui-monospace, Menlo, monospace; }
.thr .btn { display: block; width: 100%; margin-bottom: 8px; }
.cell { text-align: center; }
.cell .v { font-size: 84px; font-weight: 800; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 4px 0; font-variant-numeric: tabular-nums; border: 4px solid var(--line); transition: border-color .2s; }
.cell .v.flash { border-color: var(--accent); }
.rlog { width: 100%; border-collapse: collapse; font-size: 20px; margin-top: 12px; }
.rlog td, .rlog th { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: left; }

/* reentrancy (S24, S25) */
.reent { display: grid; grid-template-columns: 210px minmax(0, 1fr) 210px; gap: 20px; flex: 1; min-height: 0; align-items: start; }
.caller { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); border-top: 6px solid var(--tA); min-height: 170px; }
.caller.c2 { border-top-color: var(--tB); }
.caller h3 { margin: 0 0 6px; font-size: 23px; }
.caller .cs { font-size: 20px; }
.actorbox { border: 5px solid var(--actor); border-radius: 20px; padding: 12px 16px; background: var(--actor-soft); }
.actorbox .bal { font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; }
.actorbox .bal.neg { color: var(--err); }
.actorbox pre.code { font-size: 15px; margin: 8px 0 0; }
.actorbox .ln.at1 { background: rgba(245,158,11,.35); box-shadow: inset 6px 0 0 var(--tA); }
.actorbox .ln.at2 { background: rgba(14,165,164,.35); box-shadow: inset 6px 0 0 var(--tB); }
.narr { font-size: 25px; font-weight: 600; margin-top: 12px; min-height: 2.6em; }

/* phone (S26) */
.phone { width: 330px; height: 560px; border: 12px solid #222; border-radius: 44px; background: var(--card); overflow: hidden; display: flex; flex-direction: column; }
.phone .ptop { padding: 14px; font-weight: 750; font-size: 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.phone .plist { flex: 1; overflow-y: scroll; }
.phone .plist div { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 18px; }
.spin { width: 24px; height: 24px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; display: inline-block; }

/* cheat sheet (S38) */
.cgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .45em; margin-top: .5em; }
.cgrid .cc { background: var(--card); border-radius: 12px; padding: .45em .6em; box-shadow: var(--shadow); font-size: .62em; line-height: 1.3; }
.cgrid .cc .kw { font-weight: 700; margin-bottom: .2em; }
.csearch { font-size: .7em; padding: .3em .6em; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--fg); width: 420px; }

/* hover highlighter (S23) */
.hl pre.code .ln { cursor: default; transition: background .15s; position: relative; }
.hl pre.code .ln.inside:hover { background: rgba(21,153,74,.4); }
.hl pre.code .ln.outside:hover { background: rgba(224,112,18,.45); }
.hl pre.code .ln.noniso:hover { background: rgba(154,161,173,.4); }
.hl-tip { margin-top: .4em; font-size: .7em; min-height: 2.2em; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(10,12,16,.92); z-index: 50; overflow: auto; padding: 30px; color: #eef1f6; font-family: inherit; }
.overlay[hidden] { display: none; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ov-item { background: #1b2030; border: 2px solid transparent; border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; color: #eef1f6; font-size: 15px; }
.ov-item b { display: block; color: #f05138; font-size: 13px; margin-bottom: 2px; }
.ov-item.demo { background: #2a1a17; }
.ov-item.cur { border-color: #f05138; }
.help table { font-size: 18px; border-collapse: collapse; }
.help td { padding: 6px 14px; border-bottom: 1px solid #333; }
#black { position: fixed; inset: 0; background: #000; z-index: 40; }
#black[hidden] { display: none; }
#goto { position: fixed; right: 20px; bottom: 20px; background: #f05138; color: #fff; font-size: 26px; font-weight: 800; padding: 8px 16px; border-radius: 12px; z-index: 60; }
#goto[hidden] { display: none; }

/* ------------------------------------------------ presenter */

.pv-box .big { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pv-box .small { font-size: 14px; color: #8a93a3; }
.pv-box .bad { color: #ff6b6b; } .pv-box .ok { color: #4ade80; }

.pv-notes h2 { font-size: 26px; margin: 0 0 8px; color: #f05138; }
.pv-notes h4 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: #8a93a3; margin: 18px 0 6px; }
.pv-notes code { background: #252c3a; padding: 0 .25em; border-radius: 4px; font-size: .88em; }
.pv-notes pre.code { font-size: 19px; }
.pv-notes blockquote { margin: 6px 0; padding: 4px 12px; border-left: 4px solid #f05138; background: #1d2330; }
.pv-notes .ianote { font-size: 18px; color: #b3bccb; border-top: 1px solid #2a3140; padding-top: 6px; }
.pv-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.pv-btns button { background: #252c3a; border: 0; color: #eef1f6; border-radius: 8px; padding: 8px 14px; font-size: 16px; cursor: pointer; }
.pv-btns button.primary { background: #f05138; }
.pv-title { font-size: 20px; font-weight: 700; }
.pv-title small { color: #8a93a3; font-weight: 500; }

<script id="deck-data" type="application/json">{"title": "Swift Concurrency: lecture script", "subtitle": "MENDELU · 60 minutes · 40 slides · 18 short demo breaks", "parts": [{"n": 0, "name": "Opening", "start": "0:00", "end": "0:02", "minutes": 2}, {"n": 1, "name": "The problem", "start": "0:02", "end": "0:05", "minutes": 3}, {"n": 2, "name": "Before Swift concurrency", "start": "0:05", "end": "0:07", "minutes": 2}, {"n": 3, "name": "async/await", "start": "0:07", "end": "0:17", "minutes": 10}, {"n": 4, "name": "Structured concurrency", "start": "0:17", "end": "0:27", "minutes": 10}, {"n": 5, "name": "Data races & actors", "start": "0:27", "end": "0:39", "minutes": 12}, {"n": 6, "name": "Sendable & Swift 6", "start": "0:39", "end": "0:46", "minutes": 7}, {"n": 7, "name": "Approachable Concurrency (Swift 6.2+)", "start": "0:46", "end": "0:53", "minutes": 7}, {"n": 8, "name": "Wrap-up", "start": "0:53", "end": "0:55", "minutes": 2}], "frames": [{"kind": "slide", "id": "S1", "num": 1, "title": "Title", "titleText": "Title", "minutes": 0.5, "timing": "0.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<ul><li><strong>Swift Concurrency<\/strong><\/li><li><em>async/await, actors, and a compiler that catches your data races<\/em><\/li><li>Matej Molnár · STRV · 2026<\/li><\/ul>", "say": "<p>Introduce yourself. \"Over the next hour you'll see why concurrent code is hard, how Swift fixed it, and every concept running live in Xcode.\"<\/p>", "extra": "", "interactiveNote": "<p>Title animation: tangled thread lines that straighten into neat parallel lanes.<\/p>", "part": 0}, {"kind": "slide", "id": "S2", "num": 2, "title": "Why should you care?", "titleText": "Why should you care?", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<ul><li>Every app <em>waits<\/em>: network, disk, database, image decoding, ML.<\/li><li>Slow work on the main thread means a frozen UI.<\/li><\/ul>", "say": "<p>\"Your app has one main thread. It draws the UI and handles every tap. If you download a file or decode an image there, nothing else can happen; the app freezes. So we have to do work <em>concurrently<\/em>. And as soon as we do, a whole new category of bugs appears. That's today's topic.\"<\/p>", "extra": "", "interactiveNote": "", "part": 0}, {"kind": "slide", "id": "S3", "num": 3, "title": "Agenda", "titleText": "Agenda", "minutes": 0.5, "timing": "0.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<ol><li>The problem<\/li><li>Before Swift concurrency (GCD)<\/li><li>async/await<\/li><li>Structured concurrency<\/li><li>Data races &amp; actors<\/li><li>Sendable &amp; Swift 6<\/li><li>Approachable Concurrency (Swift 6.2+)<\/li><li>Wrap-up<\/li><\/ol><p>… with a live demo after almost every slide.<\/p>", "say": "<p>\"One idea to keep in mind all lecture: Swift concurrency is <em>not<\/em> just nicer syntax instead of closures. The real goal is that the <strong>compiler proves your code has no data races<\/strong>, before it ever runs.\"<\/p>", "extra": "", "interactiveNote": "<p>Agenda as a horizontal progress track that stays visible as a thin bar on later slides, so everyone knows where we are. Demo breaks appear as small 💻 markers on the track.<\/p>", "part": 0}, {"kind": "slide", "id": "S4", "num": 4, "title": "Concurrency vs. parallelism", "titleText": "Concurrency vs. parallelism", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<table><thead><tr><th>Concurrency (<em>souběžnost<\/em>)<\/th><th>Parallelism (<em>paralelismus<\/em>)<\/th><\/tr><\/thead><tbody><tr><td><em>Dealing<\/em> with many tasks at once<\/td><td><em>Doing<\/em> many tasks at the same instant<\/td><\/tr><tr><td>Tasks overlap in time and can interleave on <strong>one<\/strong> core<\/td><td>Tasks run simultaneously on <strong>multiple<\/strong> cores<\/td><\/tr><tr><td>About <strong>structure<\/strong> and responsiveness<\/td><td>About <strong>speed<\/strong><\/td><\/tr><\/tbody><\/table><p>All parallel code is concurrent, but not all concurrent code is parallel.<\/p>", "say": "<p>\"Think of a coffee shop. <strong>One<\/strong> barista taking orders, steaming milk while the espresso runs, switching between three orders: that's concurrency. <strong>Three<\/strong> baristas each making one coffee: that's parallelism. An iPhone has 6 CPU cores and a Mac has 8 to 32, so we get both. In Swift we describe concurrency, and the system decides how much actually runs in parallel.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>timeline toggle.<\/strong> Three tasks A, B, C as coloured blocks on a time axis. Toggle <strong>1 core<\/strong>: the blocks interleave as slices on one lane. Toggle <strong>2 cores<\/strong>: they spread across two lanes and the total time shrinks. A \"Play\" button animates the time cursor.<\/p>", "part": 1}, {"kind": "slide", "id": "S5", "num": 5, "title": "Threads &amp; the main thread", "titleText": "Threads & the main thread", "minutes": 0.5, "timing": "0.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<ul><li>A <strong>thread<\/strong> is an independent flow of execution. The OS schedules threads onto CPU cores. There can be many threads running at the same time.<\/li><li>The <strong>main thread<\/strong> runs the UI and handles user events. There is only one main thread.<\/li><li>Rule 1: <strong>Never block the main thread.<\/strong><\/li><li>Rule 2: <strong>Only touch the UI from the main thread.<\/strong><\/li><\/ul>", "say": "<p>\"Everything we discuss today is about following these two rules without shooting ourselves in the foot. Moving work off the main thread is easy. Doing it <em>safely<\/em> is the hard part.\"<\/p>", "extra": "", "interactiveNote": "<p>Lane diagram with one green \"main\" lane and several blue \"background\" lanes. Clicking \"download image\" sends a block to a background lane; when it finishes, an arrow brings the result back to the main lane (\"update UI\").<\/p>", "part": 1}, {"kind": "slide", "id": "S6", "num": 6, "title": "What can go wrong", "titleText": "What can go wrong", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "5 cards", "html": "<table><thead><tr><th>Problem<\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td><strong>Data race<\/strong><\/td><td>Two threads access the same memory at the same time, at least one writes, no synchronisation. The result is undefined: corrupted data or crashes.<\/td><\/tr><tr><td><strong>Race condition<\/strong><\/td><td>The result depends on the <em>timing/order<\/em> of events. It's a logic bug and can happen even without a data race.<\/td><\/tr><tr><td><strong>Deadlock<\/strong><\/td><td>Two threads wait for each other forever<\/td><\/tr><tr><td><strong>Thread explosion<\/strong><\/td><td>Too many threads (blocked threads make the system spawn more), so memory and context-switch overhead grow.<\/td><\/tr><tr><td><strong>Priority inversion<\/strong><\/td><td>Low-priority work holds a resource that high-priority work needs.<\/td><\/tr><\/tbody><\/table>", "say": "<p>\"The nasty part: these bugs depend on timing. Your tests pass 99 times and the app crashes on a user's phone on the 100th. They are very hard to reproduce. Remember the difference between a <strong>data race<\/strong> and a <strong>race condition<\/strong>. Swift 6 can eliminate the first one at compile time. The second one is still your job. Once we have the tools, we'll cause a real data race live, right before the actors part, and fix it on the spot.\"<\/p>", "extra": "", "interactiveNote": "", "part": 1}, {"kind": "slide", "id": "S7", "num": 7, "title": "GCD &amp; OperationQueue, in one slide", "titleText": "GCD & OperationQueue, in one slide", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>DispatchQueue.global(qos: .userInitiated).async {\n    let image = decode(data)            // background thread\n    DispatchQueue.main.async {\n        imageView.image = image         // back on main for the UI\n    }\n}<\/code><\/pre><ul><li><strong>GCD<\/strong> (Grand Central Dispatch, 2009) uses <strong>queues<\/strong>: <code>main<\/code>, <code>global(qos:)<\/code>, custom serial/concurrent; plus <code>DispatchGroup<\/code>, <code>DispatchSemaphore<\/code>, barriers.<\/li><li><strong>QoS<\/strong> (priority): <code>userInteractive<\/code> › <code>userInitiated<\/code> › <code>utility<\/code> › <code>background<\/code><\/li><li><strong>OperationQueue<\/strong> is object-oriented on top of GCD: dependencies between operations, cancellation, max concurrent operations.<\/li><\/ul>", "say": "<p>\"Before 2021 this was <em>the<\/em> way to do concurrency on Apple platforms, and you'll still see it in older codebases and some APIs. You don't need to master it today; just recognise it when you see it. We won't demo it. Everything it does, Swift concurrency does with better safety guarantees.\"<\/p>", "extra": "", "interactiveNote": "", "part": 2}, {"kind": "slide", "id": "S8", "num": 8, "title": "Why we needed something better", "titleText": "Why we needed something better", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "toggle between the two versions", "html": "<pre class=\"code swift\"><code>func loadProfile(completion: @escaping (Result&lt;Profile, Error&gt;) -&gt; Void) {\n    fetchUser { result in\n        switch result {\n        case .failure(let error): completion(.failure(error))\n        case .success(let user):\n            fetchAvatar(for: user) { result in\n                switch result {\n                case .failure(let error): completion(.failure(error))\n                case .success(let avatar):\n                    completion(.success(Profile(user: user, avatar: avatar)))\n                }\n            }\n        }\n    }\n}<\/code><\/pre><pre class=\"code swift\"><code>func loadProfile() async throws -&gt; Profile {\n    let user = try await fetchUser()\n    let avatar = try await fetchAvatar(for: user)\n    return Profile(user: user, avatar: avatar)\n}<\/code><\/pre><p>Problems with callbacks:<\/p><ul><li>\"Pyramid of doom\"; errors handled by hand at every level.<\/li><li>Nothing stops you from forgetting to call <code>completion<\/code>, or calling it twice.<\/li><li>Which thread does the completion run on? You have to read the docs.<\/li><li>Cancellation is hand-made.<\/li><li><strong>The compiler can't check thread safety at all.<\/strong><\/li><li>Blocked threads lead to thread explosion.<\/li><\/ul>", "say": "<p>\"Same logic, two versions. Which one would you rather review at 2 a.m.? But readability is the <em>small<\/em> win. The big win is the bullet in bold.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>code morph.<\/strong> A toggle animates the callback version into the async version: matching lines slide into place and the boilerplate fades out. A counter shows \"lines: 15 → 4\".<\/p>", "part": 2}, {"kind": "slide", "id": "S9", "num": 9, "title": "async &amp; await", "titleText": "async & await", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>func fetchUser(id: Int) async throws -&gt; User   // can suspend, can throw\n\nlet user = try await fetchUser(id: 1)          // ⏸ possible suspension point<\/code><\/pre><ul><li><strong><code>async<\/code><\/strong>: this function can <strong>suspend<\/strong> (pause) and resume later.<\/li><li><strong><code>await<\/code><\/strong>: marks the places where suspension may happen.<\/li><li>An async function can only be called from an async context.<\/li><li>Works with functions, initialisers, computed properties (<code>get async<\/code>), closures and <code>for await<\/code> loops.<\/li><\/ul>", "say": "<p>\"Read <code>await<\/code> as: <em>this may take a while, and other work can happen meanwhile<\/em>. The code still reads top to bottom, and errors use the normal <code>try<\/code>/<code>catch<\/code>. This arrived in Swift 5.5 in 2021, and it's the foundation for everything else today.\"<\/p>", "extra": "", "interactiveNote": "", "part": 3}, {"kind": "slide", "id": "S10", "num": 10, "title": "Suspending is not blocking", "titleText": "Suspending is not blocking", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>func refresh() async {\n    // running on thread 3\n    let users = await api.fetchUsers()   // ⏸ thread 3 is free to do other work\n    // may continue on thread 5\n}<\/code><\/pre><ul><li>At <code>await<\/code>, the function <strong>gives up its thread<\/strong>. The thread runs other tasks meanwhile.<\/li><li>Swift runs tasks on a <strong>cooperative thread pool<\/strong> with about <strong>one thread per CPU core<\/strong>, so there is no thread explosion.<\/li><li>The contract: <strong>never block a thread in async code.<\/strong> No <code>sleep()<\/code>, no <code>semaphore.wait()<\/code>.<\/li><li><code>Thread.current<\/code> is unavailable in async code. <em>Think in tasks and actors, not threads.<\/em><\/li><\/ul>", "say": "<p>\"This is the key mechanic. GCD's answer to waiting was: block this thread, start another one. With 100 downloads, you get 100 threads. Swift's answer: the waiting function steps aside, its state is saved, and the thread picks up other work. When the result arrives, the function continues on <em>some<\/em> thread from the pool. That's why the thread number can change after <code>await<\/code>, and why Apple took <code>Thread.current<\/code> away from async code. Threads are an implementation detail now.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>thread-pool visualiser<\/strong> (one of the most valuable visuals). Lanes for 4 cores, with tasks as coloured blocks.<\/p><ul><li>Mode <strong>\"Blocking (GCD)\"<\/strong>: when a task waits, its lane turns grey (blocked) and a new lane is spawned; a \"threads: 4 → 23\" counter climbs.<\/li><li>Mode <strong>\"Suspending (Swift)\"<\/strong>: a waiting task lifts off its lane into a \"suspended\" tray, another task takes the lane, and later it drops back onto <em>any<\/em> free lane.<\/li><\/ul>", "part": 3}, {"kind": "slide", "id": "S11", "num": 11, "title": "How the demos work", "titleText": "How the demos work", "minutes": 0.5, "timing": "0.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>import Playgrounds\n\n#Playground(\"1a · Calling an async function\") {\n    // runs when you open this file with the canvas visible\n    // runs on the MAIN ACTOR, like UI code\n}<\/code><\/pre><ul><li>Every demo is <strong>its own file<\/strong> with one <code>#Playground { }<\/code> block, in a folder per topic. Open the file and the block runs in <strong>Xcode's canvas<\/strong> (Editor ▸ Canvas), like a SwiftUI preview. <code>print<\/code> output shows up there.<\/li><li>Code inside a <code>#Playground<\/code> runs on the <strong>main actor<\/strong>, i.e. on the main thread, like UI code.<\/li><li>The demo package is compiled in the <strong>Swift 6 language mode<\/strong>, so data races are compile errors.<\/li><li>Lines marked <code>❌ Uncomment<\/code> contain a compile error on purpose.<\/li><\/ul>", "say": "<p>\"From now on, almost every slide is followed by a short demo. All demos live in one small Swift package that you'll get afterwards. Each demo is one small Swift file with a <code>#Playground<\/code> block, which is new in Xcode 26: like a classic playground, but inside a normal Swift file. The folders follow today's topics. Remember one detail: code in a playground runs on the <em>main actor<\/em>, the same place your UI code runs.\"<\/p>", "extra": "", "interactiveNote": "<p>Mock of the Xcode window: the navigator with topic folders (<code>01_AsyncAwait<\/code>, <code>02_StructuredConcurrency<\/code>, …), the code in the middle and the canvas on the right. Click a demo file to show its code and output.<\/p>", "part": 3}, {"kind": "slide", "id": "S12", "num": 12, "title": "Demo toolkit: fake slow work &amp; helpers", "titleText": "Demo toolkit: fake slow work & helpers", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>try await Task.sleep(for: .seconds(1))   // ⏸ pauses THIS task for 1 s; the thread is free\nThread.sleep(forTimeInterval: 1)         // ⛔ blocks the thread; not allowed in async code<\/code><\/pre><pre class=\"code swift\"><code>printThread(\"load\")                 // prints 🟢 load → main thread\n                                    //     or 🔵 load → background thread #3\ntry await measure(\"download\") {     // runs the block and prints\n    try await downloadImage(1)      // ⏱️ download: 1.00 s\n}<\/code><\/pre><ul><li><strong><code>Task.sleep(for:)<\/code><\/strong> is our stand-in for a network request: it takes time, but uses no CPU and blocks no thread. It throws if the task is cancelled (Part 4).<\/li><li><strong><code>Thread.sleep<\/code><\/strong> is the blocking version. Swift 6 rejects it in async code: <em>\"class method 'sleep' is unavailable from asynchronous contexts\"<\/em>.<\/li><li><strong><code>printThread<\/code><\/strong> and <strong><code>measure<\/code><\/strong> are our two helpers, about 30 lines in <code>Sources/Helpers/Helpers.swift<\/code>. Nothing magic.<\/li><li><strong><code>downloadImage(_:)<\/code><\/strong> is our fake download, used in Demo 2 (<code>Sources/Demos/02_StructuredConcurrency/DownloadImage.swift<\/code>). It does <code>Task.sleep<\/code> for 1 s, then <code>printThread<\/code>, then returns <code>\"🖼️1\"<\/code>.<\/li><\/ul>", "say": "<p>\"Our demos don't talk to a real server. <code>Task.sleep<\/code> pretends to: it waits, but it's a <em>suspension<\/em>, exactly what we saw on S10, so the thread is free. Its old cousin <code>Thread.sleep<\/code> blocks the thread, and Swift doesn't even let you call it from async code. And two small helpers: <code>printThread<\/code> answers <em>where is this code running?<\/em>, which is the question of the slide after the demo, and <code>measure<\/code> tells us how long something took.\"<\/p>", "extra": "", "interactiveNote": "<p>A mini version of the S10 thread-pool visualiser with two buttons. <code>Task.sleep<\/code> lifts the task off the lane (other chips use the lane meanwhile). <code>Thread.sleep<\/code> turns the lane red for the whole second.<\/p>", "part": 3}, {"kind": "demo", "id": "D1a", "demoId": "1a", "title": "Calling an async function", "titleText": "Calling an async function", "minutes": 1.0, "files": "<code>Sources/Demos/01_AsyncAwait/1a_CallingAnAsyncFunction.swift<\/code>", "concepts": [{"code": "<code>#Playground(\"…\") { }<\/code>", "say": "One file, one demo; runs on the main actor", "explained": "S11", "refs": ["S11"]}, {"code": "<code>func fetchUser(id:) async throws<\/code>, <code>try await<\/code>", "say": "Can suspend; we wait without blocking", "explained": "S9", "refs": ["S9"]}, {"code": "<code>Task.sleep(for:)<\/code>", "say": "Fake network delay of 1 s; suspends, doesn't block", "explained": "S12", "refs": ["S12"]}, {"code": "<code>measure(\"…\") { }<\/code>", "say": "Prints how long the block took", "explained": "S12", "refs": ["S12"]}], "say": "<ol><li>Show <code>fetchUser(id:)<\/code>. It is just <code>Task.sleep<\/code> for 1 s plus a return value.<\/li><li><p>Run:<\/p><pre class=\"code plain\"><code>Hello, Student #1\nStudent #2 Student #3\n⏱️ two more users: 2.02 s<\/code><\/pre><\/li><li>🎤 \"Two awaits in a row run <strong>one after another<\/strong>: 1 s + 1 s = 2 s. <code>await<\/code> waits; it doesn't parallelise. Remember that for Part 4.\"<\/li><\/ol>", "part": 3}, {"kind": "slide", "id": "S13", "num": 13, "title": "<code>async<\/code> ≠ background", "titleText": "async ≠ background", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<table><thead><tr><th>You write<\/th><th>It runs on<\/th><\/tr><\/thead><tbody><tr><td><code>@MainActor func load() async<\/code><\/td><td>the <strong>main actor<\/strong> (main thread)<\/td><\/tr><tr><td>a method of an <code>actor<\/code><\/td><td><strong>that actor<\/strong><\/td><\/tr><tr><td>plain <code>func load() async<\/code><\/td><td><strong>the caller's actor<\/strong> (Swift 6.2+ with Approachable Concurrency, the default in new Xcode projects)<\/td><\/tr><tr><td><code>@concurrent func load() async<\/code><\/td><td>the <strong>background thread pool<\/strong><\/td><\/tr><\/tbody><\/table>", "say": "<p>\"The most common misconception: <em>async means it runs in the background<\/em>. No. <code>async<\/code> means <em>can suspend<\/em>. A plain async function runs wherever it was called from, so if you call it from the main actor, it runs on the main thread. If you want CPU-heavy work off the main thread, say so explicitly with <code>@concurrent<\/code>.<\/p><p>One honest note: this changed in Swift 6.2. Before, plain async functions always hopped to the background. Many blog posts from 2021–2024 describe the old behaviour. New Xcode projects turn the new behaviour on by default, and we'll come back to this in Part 7.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>\"Where does it run?\" (simple version).<\/strong> Four function signatures. Click one and an animated dot travels to the 🟢 main lane or to a 🔵 background lane. (The full version with build-setting toggles is on S35.)<\/p>", "part": 3}, {"kind": "demo", "id": "D1b", "demoId": "1b", "title": "async ≠ background thread", "titleText": "async ≠ background thread", "minutes": 1.0, "files": "<code>Sources/Demos/01_AsyncAwait/1b_AsyncIsNotBackground.swift<\/code>", "concepts": [{"code": "<code>printThread(\"…\")<\/code>", "say": "Prints 🟢 main or 🔵 background", "explained": "S12", "refs": ["S12"]}, {"code": "Playground runs on the main actor", "say": "Our \"caller\" is the main actor", "explained": "S11", "refs": ["S11"]}, {"code": "plain <code>async func<\/code> vs <code>@concurrent func<\/code>", "say": "Caller's actor vs background pool", "explained": "S13", "refs": ["S13"]}], "say": "<ol><li>🎤 Before running, ask: \"Playground code runs on the main actor. Which of these lines print <em>main thread<\/em>?\"<\/li><li><p>Run:<\/p><pre class=\"code plain\"><code>🟢 playground → main thread\n🟢 loadProfile – before await → main thread\n🟢 loadProfile – after await → main thread\n🔵 resizePhotos – before await → background thread #2\n🔵 resizePhotos – after await → background thread #2<\/code><\/pre><p>(Thread numbers vary. After <code>await<\/code>, a <code>@concurrent<\/code> function can continue on a different thread.)<\/p><\/li><li>🎤 \"The plain async function stayed on main: it ran on the caller's actor. Only <code>@concurrent<\/code> moved to the background.\"<\/li><li><p><em>Optional:<\/em> uncomment both <code>try await loadProfile()<\/code> lines: the one inside <code>resizePhotos()<\/code> and the one at the end of the playground. Run again. The output gains four lines:<\/p><pre class=\"code plain\"><code>🔵 loadProfile – before await → background thread #2\n🔵 loadProfile – after await → background thread #2\n🟢 loadProfile – before await → main thread\n🟢 loadProfile – after await → main thread<\/code><\/pre><p>🎤 \"Same function, called from two places. From inside the <code>@concurrent<\/code> function it runs in the background; from the playground it's back on main. A plain async function always runs where its caller runs.\" Comment both lines out again.<\/p><\/li><\/ol>", "part": 3}, {"kind": "slide", "id": "S14", "num": 14, "title": "Entering the async world &amp; bridging old APIs", "titleText": "Entering the async world & bridging old APIs", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>// From synchronous code, e.g. a button action:\nButton(\"Load\") {\n    Task { await viewModel.load() }\n}\n\n// SwiftUI: starts when the view appears, CANCELLED when it disappears\n.task { await viewModel.load() }<\/code><\/pre><pre class=\"code swift\"><code>// Wrapping an old completion-handler API:\nfunc fetchUser(id: Int) async throws -&gt; User {\n    try await withCheckedThrowingContinuation { continuation in\n        fetchUser(id: id) { result in\n            continuation.resume(with: result)   // resume EXACTLY once\n        }\n    }\n}<\/code><\/pre>", "say": "<p>\"Two ways in: <code>Task { }<\/code> from synchronous code, or SwiftUI's <code>.task<\/code> modifier, which also cancels for you. Most Apple APIs already have async versions: <code>URLSession.shared.data(from:)<\/code>, Photos, StoreKit 2, HealthKit. For old callback code, use a continuation. Resume it <em>exactly once<\/em>: twice crashes, and never leaves the caller waiting forever.<\/p><p>The opposite direction has no safe answer. There's no safe way to call async code from sync code <em>and wait<\/em> for the result. If you need the result, make the caller async too.\"<\/p>", "extra": "", "interactiveNote": "", "part": 3}, {"kind": "slide", "id": "S15", "num": 15, "title": "AsyncSequence", "titleText": "AsyncSequence", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>// Consuming: values arrive over time\nfor await number in countdown(from: 3) {\n    print(number)\n}\n\n// Producing your own with AsyncStream\nfunc countdown(from start: Int) -&gt; AsyncStream&lt;Int&gt; {\n    AsyncStream { continuation in\n        Task {\n            for number in stride(from: start, through: 0, by: -1) {\n                continuation.yield(number)   // send a value to the for-await loop\n                try? await Task.sleep(for: .seconds(1))\n            }\n            continuation.finish()            // ends the loop\n        }\n    }\n}<\/code><\/pre><ul><li>Like <code>Sequence<\/code>, but values arrive <strong>over time<\/strong>.<\/li><li>Apple APIs: <code>NotificationCenter.default.notifications(named:)<\/code>, <code>URLSession.shared.bytes(from:)<\/code>.<\/li><\/ul>", "say": "<p>\"One more shape of async: a stream of values over time, consumed with <code>for await<\/code>. Think notifications, download progress, Bluetooth readings. <code>AsyncStream<\/code> lets you build your own: <code>yield<\/code> sends a value, and <code>finish<\/code> ends the loop. The <code>Task { }<\/code> inside is the one from the previous slide: it starts the producer.\"<\/p>", "extra": "", "interactiveNote": "<p>Values drop into a <code>for await<\/code> loop box one by one, with gaps between them.<\/p>", "part": 3}, {"kind": "demo", "id": "D1c", "demoId": "1c", "title": "AsyncSequence", "titleText": "AsyncSequence", "minutes": 0.5, "files": "<code>Sources/Demos/01_AsyncAwait/1c_AsyncSequence.swift<\/code>", "concepts": [{"code": "<code>AsyncStream<\/code>, <code>yield<\/code>, <code>finish<\/code>, <code>for await<\/code>", "say": "Values over time", "explained": "S15", "refs": ["S15"]}, {"code": "<code>Task { }<\/code> inside the stream", "say": "Starts the producer", "explained": "S14", "refs": ["S14"]}], "say": "<p>Run it (one line per second):<\/p><pre class=\"code plain\"><code>3…\n2…\n1…\n🚀 Liftoff!<\/code><\/pre>", "part": 3}, {"kind": "slide", "id": "S16", "num": 16, "title": "Doing things in parallel: <code>async let<\/code>", "titleText": "Doing things in parallel: async let", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>// Sequential: ~3 s\nlet first  = try await downloadImage(1)\nlet second = try await downloadImage(2)\nlet third  = try await downloadImage(3)<\/code><\/pre><pre class=\"code swift\"><code>// Parallel: ~1 s\nasync let first  = downloadImage(1)    // starts immediately\nasync let second = downloadImage(2)\nasync let third  = downloadImage(3)\nlet images = try await [first, second, third]   // wait for all<\/code><\/pre>", "say": "<p>\"This fixes what we saw in Demo 1a. <code>async let<\/code> starts a <strong>child task<\/strong> right away and gives you a placeholder. You <code>await<\/code> when you actually need the value. If you leave the scope without awaiting, Swift cancels and awaits the child for you, so nothing leaks. Use it when you know up front how many things run in parallel.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>parallel timeline.<\/strong> Three bars on a time axis with a \"Run\" button and <strong>Sequential / async let<\/strong> toggle. Sequential: the bars run one after another, total 3.0 s. async let: the bars run stacked in parallel, total 1.0 s. The total-time counter animates.<\/p>", "part": 4}, {"kind": "demo", "id": "D2a-2b", "demoId": "2a + 2b", "title": "Sequential vs <code>async let<\/code>", "titleText": "Sequential vs async let", "minutes": 1.5, "files": "<code>Sources/Demos/02_StructuredConcurrency/2a_Sequential.swift<\/code>, then <code>2b_AsyncLet.swift<\/code>. <code>downloadImage(_:)<\/code> is in <code>DownloadImage.swift<\/code> in the same folder.", "concepts": [{"code": "<code>downloadImage(_:)<\/code>", "say": "<code>Task.sleep<\/code> for 1 s, prints its thread, returns <code>\"🖼️1\"<\/code>", "explained": "S12", "refs": ["S12"]}, {"code": "<code>measure(\"…\") { }<\/code>", "say": "Prints how long it took", "explained": "S12", "refs": ["S12"]}, {"code": "<code>async let<\/code>", "say": "Start a child task now, <code>await<\/code> later", "explained": "S16", "refs": ["S16"]}], "say": "<p>Run the two files one after another:<\/p><pre class=\"code plain\"><code>🟢 image 1 → main thread\n🟢 image 2 → main thread\n🟢 image 3 → main thread\n⏱️ 3 downloads, one after another: 3.16 s\n\n🔵 image 1 → background thread #2\n🔵 image 3 → background thread #3\n🔵 image 2 → background thread #4\n⏱️ 3 downloads with async let: 1.03 s<\/code><\/pre><p>🎤 \"3 seconds → 1 second. Look at the threads too.<\/p><ul><li>The sequential downloads ran on <strong>main<\/strong>: <code>downloadImage<\/code> is a plain async function, so it runs where its caller runs (Demo 1b).<\/li><li><code>async let<\/code> children are <strong>child tasks<\/strong>. They don't inherit the main actor, so they run in parallel on background threads.\"<\/li><\/ul>", "part": 4}, {"kind": "slide", "id": "S17", "num": 17, "title": "Task groups: a dynamic number of child tasks", "titleText": "Task groups: a dynamic number of child tasks", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>let images = try await withThrowingTaskGroup { group in\n    for id in 1...10 {\n        group.addTask { try await downloadImage(id) }   // start one child task\n    }\n\n    var images: [String] = []\n    for try await image in group {   // collect results in COMPLETION order\n        images.append(image)\n    }\n    return images\n}                                    // ← continues only when every child has finished<\/code><\/pre><pre class=\"code swift\"><code>// Children that return nothing:\nawait withTaskGroup(of: Void.self) { group in\n    for _ in 1...100_000 {\n        group.addTask { counter.increment() }\n    }\n}<\/code><\/pre><ul><li><code>withTaskGroup<\/code> / <code>withThrowingTaskGroup<\/code> opens a group. <code>addTask { }<\/code> starts a <strong>child task<\/strong> in it.<\/li><li>Children run <strong>concurrently<\/strong>; on a multi-core CPU that means truly in parallel.<\/li><li>The group returns only when <strong>all<\/strong> its children have finished.<\/li><li><code>for try await … in group<\/code> collects results as each child finishes, in <strong>completion order<\/strong>. Return <code>(id, value)<\/code> pairs if order matters.<\/li><li>If a child throws and the error leaves the group, the <strong>remaining children are cancelled<\/strong>.<\/li><li><code>of: Void.self<\/code> when the children return nothing; <code>withDiscardingTaskGroup<\/code> when you don't need results at all.<\/li><li>Use a group when the number of tasks is known only at runtime.<\/li><\/ul>", "say": "<p>\"Same idea as <code>async let<\/code>, for 'N things'. Think of a group as a box: you throw work into it with <code>addTask<\/code>, Swift runs everything in the box in parallel on all cores, and when the box is empty, your code continues on the next line. Note the completion order; it surprises people in code review. And remember the second, smaller form: 100,000 children that each add 1 to a counter. We'll use exactly that loop later to break something.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>task-group animation.<\/strong><\/p><ul><li>A \"group\" box. Clicking <code>addTask<\/code> (or \"add 10\") drops child chips onto 4 core lanes, where they fill up in parallel.<\/li><li>As each chip finishes, its label flies into the result array, so the array visibly fills out of order.<\/li><li>The closing <code>}<\/code> pulses with \"waiting…\" until the last chip is done.<\/li><li>A slider sets the number of children; a toggle switches between 1, 4 and 8 cores.<\/li><\/ul>", "part": 4}, {"kind": "demo", "id": "D2c", "demoId": "2c", "title": "TaskGroup", "titleText": "TaskGroup", "minutes": 1.0, "files": "<code>Sources/Demos/02_StructuredConcurrency/2c_TaskGroup.swift<\/code>", "concepts": [{"code": "<code>withThrowingTaskGroup<\/code> + <code>group.addTask { }<\/code>", "say": "10 children, started in a loop", "explained": "S17", "refs": ["S17"]}, {"code": "<code>for try await image in group<\/code>", "say": "Results in completion order", "explained": "S17", "refs": ["S17"]}], "say": "<p>Run:<\/p><pre class=\"code plain\"><code>🔵 image 1 → background thread #5\n🔵 image 3 → background thread #3\n   … (one line per image, on different threads)\n[\"🖼️1\", \"🖼️3\", \"🖼️2\", \"🖼️6\", \"🖼️8\", \"🖼️4\", \"🖼️5\", \"🖼️10\", \"🖼️9\", \"🖼️7\"]\n⏱️ 10 downloads in a TaskGroup: 1.02 s<\/code><\/pre><p>🎤 \"10 downloads still take about 1 second. The array is in completion order, different on each run. Run it again to see.\"<\/p>", "part": 4}, {"kind": "slide", "id": "S18", "num": 18, "title": "Structured concurrency = a tree of tasks", "titleText": "Structured concurrency = a tree of tasks", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code plain\"><code>              loadScreen()\n            ╱      │       ╲\n     profile   async let    TaskGroup\n                           ╱    │    ╲\n                        img1  img2  img3<\/code><\/pre><ol><li>A child task <strong>can't outlive<\/strong> its parent scope, so there are no leaks.<\/li><li><strong>Cancelling<\/strong> a parent cancels all its children.<\/li><li><strong>Errors<\/strong> propagate up to the parent.<\/li><li>Children inherit <strong>priority<\/strong> and task-local values.<\/li><\/ol>", "say": "<p>\"'Structured' as in structured programming. We stopped using <code>goto<\/code> because <code>if<\/code> and loops have a clear start and end. Same here: every child task has a parent and a clear lifetime. That's what makes cancellation and error handling <em>automatic<\/em>. <code>async let<\/code> and task groups create child tasks. <code>Task { }<\/code> does <strong>not<\/strong>, as we'll see in a minute.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>task tree.<\/strong> A clickable tree of nodes.<\/p><ul><li>Click ✖ on a node: its whole subtree turns red (\"cancelled\").<\/li><li>Click ⚡ on a leaf (\"throws\"): the error bubbles up and its siblings get cancelled.<\/li><li>A separate, unconnected node labelled <code>Task { }<\/code> sits next to the tree and stays green when you cancel the root.<\/li><\/ul>", "part": 4}, {"kind": "slide", "id": "S19", "num": 19, "title": "Cancellation is cooperative", "titleText": "Cancellation is cooperative", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>func processPhotos() async throws {\n    for photo in photos {\n        try Task.checkCancellation()        // throws CancellationError\n        process(photo)\n        try await Task.sleep(for: .seconds(1))     // also checks cancellation\n    }\n}\n\nlet task = Task {\n    do { try await processPhotos() }\n    catch { print(\"🛑 Stopped: \\(error)\") }\n}\ntask.cancel()          // only sets a flag!\nawait task.value       // wait until the task has actually stopped<\/code><\/pre><ul><li><code>cancel()<\/code> <strong>does not stop<\/strong> a task. It only sets a flag.<\/li><li>Your code checks it with <code>Task.isCancelled<\/code> or <code>try Task.checkCancellation()<\/code>.<\/li><li><code>Task.isCancelled<\/code> is a <code>Bool<\/code>. <code>try Task.checkCancellation()<\/code> <strong>throws <code>CancellationError<\/code><\/strong> if the flag is set.<\/li><li>Apple APIs (<code>Task.sleep<\/code>, <code>URLSession<\/code>) check it for you and throw.<\/li><li><code>await task.value<\/code> waits for a task to finish. More about task handles on the next slide.<\/li><li><code>withTaskCancellationHandler<\/code> reacts immediately (e.g. to close a socket).<\/li><\/ul>", "say": "<p>\"Why not kill the task immediately? Because it could be halfway through writing a file or updating state. Cooperative cancellation means the task stops at a point where it's safe to stop. If you write a long loop, check cancellation inside it.\"<\/p>", "extra": "", "interactiveNote": "<p>A progress bar processes items 1…10, with a big \"Cancel\" button. With \"checks cancellation\" <strong>on<\/strong>, it stops at the next item boundary. With it <strong>off<\/strong>, it ignores the click and runs to the end.<\/p>", "part": 4}, {"kind": "demo", "id": "D2d", "demoId": "2d", "title": "Cancellation is cooperative", "titleText": "Cancellation is cooperative", "minutes": 0.5, "files": "<code>Sources/Demos/02_StructuredConcurrency/2d_Cancellation.swift<\/code>", "concepts": [{"code": "<code>try Task.checkCancellation()<\/code>, <code>CancellationError<\/code>", "say": "Cooperative cancellation", "explained": "S19", "refs": ["S19"]}, {"code": "<code>Task { }<\/code>, <code>task.cancel()<\/code>, <code>await task.value<\/code>", "say": "Start it, cancel it after 1 s, wait for it to stop", "explained": "S14, S19", "refs": ["S14", "S19"]}], "say": "<p>Run:<\/p><pre class=\"code plain\"><code>Processing photo 1\n🛑 Stopped: CancellationError()<\/code><\/pre><p>🎤 \"We cancel after 1 second, while the task sleeps after photo 1. <code>Task.sleep<\/code> notices the flag and throws <code>CancellationError<\/code>, so photo 2 never starts.\"<\/p>", "part": 4}, {"kind": "slide", "id": "S20", "num": 20, "title": "Unstructured tasks: <code>Task {}<\/code> and <code>Task.detached {}<\/code>", "titleText": "Unstructured tasks: Task {} and Task.detached {}", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>let task = Task { try await downloadImage(1) }   // starts right away, has NO parent\n\nlet image = try await task.value                 // wait for its result (or its error)…\ntask.cancel()                                    // …or stop it. Nobody else will.<\/code><\/pre><table><thead><tr><th><\/th><th><code>async let<\/code> / group child<\/th><th><code>Task { }<\/code><\/th><th><code>Task.detached { }<\/code><\/th><\/tr><\/thead><tbody><tr><td>Has a parent<\/td><td>✅<\/td><td>❌<\/td><td>❌<\/td><\/tr><tr><td>Cancelled with the parent<\/td><td>✅<\/td><td>❌ <strong>no!<\/strong><\/td><td>❌<\/td><\/tr><tr><td>Inherits the actor (e.g. MainActor)<\/td><td>❌ (runs concurrently)<\/td><td>✅<\/td><td>❌<\/td><\/tr><tr><td>Inherits priority &amp; task-locals<\/td><td>✅<\/td><td>✅<\/td><td>❌<\/td><\/tr><tr><td>Typical use<\/td><td>parallel work inside an async function<\/td><td>starting async work from sync code<\/td><td>almost never<\/td><\/tr><\/tbody><\/table>", "say": "<p>\"<code>Task { }<\/code> gives you back a <em>handle<\/em>. <code>task.value<\/code> waits for the result, and <code>task.cancel()<\/code> cancels it. Many places can await the same handle.<\/p><p><code>Task { }<\/code> is fire-and-forget: it inherits the actor and priority of where it was created, but it's <strong>not a child<\/strong>, so nobody cancels it for you. Keep the handle and call <code>cancel()<\/code> yourself, or in SwiftUI use <code>.task { }<\/code>.<\/p><p><code>Task.detached<\/code> inherits nothing. People reach for it to run something in the background, but a <code>@concurrent<\/code> function is usually the cleaner answer.<\/p><p>Careful: some articles, including an older version of this talk, claim that a <code>Task { }<\/code> inside a cancelled task is cancelled too. It isn't. Let me prove it.\"<\/p>", "extra": "", "interactiveNote": "<p>Reuse the task tree from S18: drag a <code>Task { }<\/code> node into the tree, and it snaps <em>beside<\/em> the tree, not into it.<\/p>", "part": 4}, {"kind": "demo", "id": "D2e", "demoId": "2e", "title": "<code>Task {}<\/code> is NOT a child task", "titleText": "Task {} is NOT a child task", "minutes": 1.0, "files": "<code>Sources/Demos/02_StructuredConcurrency/2e_TaskIsNotAChild.swift<\/code>", "concepts": [{"code": "<code>async let<\/code> vs <code>Task { }<\/code> inside a parent task", "say": "Child task vs unstructured task", "explained": "S16, S20", "refs": ["S16", "S20"]}, {"code": "<code>async let child: Void = work(…)<\/code>", "say": "<code>async let<\/code> for a function that returns nothing needs the <code>: Void<\/code> type", "explained": "here", "refs": []}, {"code": "<code>parent.cancel()<\/code>, <code>await parent.value<\/code>", "say": "Cancel the parent right away, then wait", "explained": "S19, S20", "refs": ["S19", "S20"]}], "say": "<ol><li>🎤 Before running, ask: \"We cancel the parent right away. Which of the two prints ✅?\"<\/li><li><p>Run:<\/p><pre class=\"code plain\"><code>🛑 async let (child task) was cancelled\n✅ Task {} (unstructured) finished<\/code><\/pre><p>(The ✅ line appears after 2 seconds.)<\/p><\/li><li>🎤 \"The <code>async let<\/code> child was cancelled with its parent. The <code>Task { }<\/code> didn't even notice.\"<\/li><\/ol>", "part": 4}, {"kind": "slide", "id": "S21", "num": 21, "title": "Anatomy of a data race", "titleText": "Anatomy of a data race", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>counter.value += 1\n// is really three steps:\n// 1. read   value  (41)\n// 2. add    1      (42)\n// 3. write  value  (42)<\/code><\/pre><table><thead><tr><th>Thread A<\/th><th>Thread B<\/th><th><code>value<\/code><\/th><\/tr><\/thead><tbody><tr><td>read 41<\/td><td><\/td><td>41<\/td><\/tr><tr><td><\/td><td>read 41<\/td><td>41<\/td><\/tr><tr><td>write 42<\/td><td><\/td><td>42<\/td><\/tr><tr><td><\/td><td>write 42<\/td><td><strong>42<\/strong> ← one increment lost<\/td><\/tr><\/tbody><\/table><p>One new word for the demo:<\/p><ul><li><strong><code>Sendable<\/code><\/strong>: \"safe to share between tasks running at the same time\". Swift 6 lets a value into concurrent child tasks only if it's <code>Sendable<\/code>.<\/li><li><strong><code>@unchecked Sendable<\/code><\/strong>: \"don't check this, trust me\". Full story in Part 6.<\/li><\/ul>", "say": "<p>\"<code>+= 1<\/code> looks like one operation, but the CPU does three. If two threads interleave like this, one increment disappears. No crash, no error. The number is just wrong.<\/p><p>We'll run the loop from S17: 100,000 child tasks, each adding 1 to the same counter. A plain class with a <code>var<\/code> isn't safe to share, and Swift 6 knows it: it won't even compile that loop. So to <em>see<\/em> the bug, we have to lie to the compiler with <code>@unchecked Sendable<\/code>.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>data-race stepper.<\/strong> Two thread columns, each with <em>read → add → write<\/em> buttons, and a shared memory cell. Students click steps in any order. A \"Random interleaving\" button runs it 1,000 times and shows how often the final value is wrong.<\/p>", "part": 5}, {"kind": "demo", "id": "D3", "demoId": "3", "title": "Data race", "titleText": "Data race", "minutes": 1.5, "files": "<code>Sources/Demos/03_DataRace/3_DataRace.swift<\/code>", "concepts": [{"code": "<code>withTaskGroup(of: Void.self)<\/code> + <code>group.addTask { }<\/code>", "say": "100,000 child tasks at the same time; continue when all are done", "explained": "S17", "refs": ["S17"]}, {"code": "<code>@unchecked Sendable<\/code>", "say": "\"Trust me, it's thread-safe.\" The compiler stops checking.", "explained": "S21", "refs": ["S21"]}, {"code": "Playground runs on the main actor", "say": "Appears in the error message", "explained": "S11", "refs": ["S11"]}], "say": "<ol><li>Show <code>UnsafeCounter: @unchecked Sendable<\/code>, a plain class with <code>var value<\/code>.<\/li><li><p>Delete <code>: @unchecked Sendable<\/code>. The build fails:<\/p><blockquote><p><code>Passing closure as a 'sending' parameter risks causing data races between main actor-isolated code and concurrent execution of the closure<\/code><\/p><\/blockquote><p>🎤 Translate the message: \"<em>main actor-isolated code<\/em> is our playground. <em>Concurrent execution of the closure<\/em> is the child tasks. The closure captures a counter that isn't safe to share, so the compiler says no. We haven't run anything, and the compiler already found the data race.\" Undo (⌘Z) to put <code>@unchecked Sendable<\/code> back.<\/p><\/li><li><p>Run it, then run it again.<\/p><pre class=\"code plain\"><code>Expected 100000, got 97345<\/code><\/pre><p>(The number differs on every run. My runs gave about 97,000–98,600.)<\/p><\/li><li>🎤 \"No crash, no warning. Just silently wrong data. That's what makes data races so dangerous. So how do we fix it properly, in a way the compiler can check?\"<\/li><\/ol>", "part": 5}, {"kind": "slide", "id": "S22", "num": 22, "title": "Actors", "titleText": "Actors", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>actor Counter {\n    var value = 0\n    func increment() { value += 1 }\n}\n\nlet counter = Counter()\nawait counter.increment()\nprint(await counter.value)<\/code><\/pre><ul><li>A <strong>reference type<\/strong>, like a class, but it <strong>protects its mutable state<\/strong>.<\/li><li>Only <strong>one task at a time<\/strong> runs inside an actor. The others wait their turn (suspended, not blocked).<\/li><li>Calls from outside need <code>await<\/code>: you may have to wait your turn.<\/li><li>The <strong>compiler enforces<\/strong> the access rules, so data races on its state are impossible.<\/li><li>An actor is <strong>not a thread.<\/strong> It may run on different threads over time. <code>MainActor<\/code> is the exception: it always runs on the main thread.<\/li><\/ul>", "say": "<p>\"Here's the fix for the counter we just broke. Before Swift concurrency, you'd fix it by hand: wrap every access in a lock or a private serial queue, and hope nobody forgets one. An actor is that idea built into the language. Two differences: callers that have to wait <em>suspend<\/em> instead of blocking a thread, and <strong>the compiler checks it<\/strong>, so you can't forget anything. One word changes: <code>class<\/code> becomes <code>actor<\/code>.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>actor mailbox.<\/strong> An actor drawn as a room with one door and a queue of message envelopes (<code>increment()<\/code>). Several tasks drop envelopes at the same time, and the actor processes one at a time. Side by side: a plain class \"room\" with no door, where envelopes collide and the counter ends wrong. A \"Send 100\" button runs both.<\/p>", "part": 5}, {"kind": "demo", "id": "D4a", "demoId": "4a", "title": "An actor fixes the data race", "titleText": "An actor fixes the data race", "minutes": 0.5, "files": "<code>Sources/Demos/04_Actors/4a_ActorFixesTheDataRace.swift<\/code>", "concepts": [{"code": "<code>actor Counter<\/code>", "say": "Only one task at a time inside", "explained": "S22", "refs": ["S22"]}, {"code": "<code>await counter.increment()<\/code>", "say": "Calls from outside the actor are awaited", "explained": "S22", "refs": ["S22"]}, {"code": "Task group loop", "say": "The same 100,000 children as Demo 3", "explained": "S17", "refs": ["S17"]}], "say": "<ol><li>Put it next to Demo 3: the same loop, now with <code>actor Counter<\/code> and <code>await counter.increment()<\/code>. No <code>@unchecked<\/code> anywhere.<\/li><li>Run: <code>Expected 100000, got 100000<\/code><\/li><li>🎤 \"Correct result, and this time the compiler guarantees it.\"<\/li><\/ol>", "part": 5}, {"kind": "slide", "id": "S23", "num": 23, "title": "Actor isolation rules", "titleText": "Actor isolation rules", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>actor BankAccount {\n    let iban: String            // immutable → readable without await (same module)\n    var balance: Decimal = 0    // mutable  → isolated\n\n    func deposit(_ amount: Decimal) {\n        balance += amount       // inside: plain synchronous code\n    }\n\n    nonisolated var description: String { \"Account \\(iban)\" }  // opt out: no await,\n}                                                              // but can't touch balance\n\nawait account.deposit(100)      // outside: await (we may have to wait our turn)\naccount.balance = 0             // ❌ can't mutate actor state from outside, not even with await<\/code><\/pre><ul><li><strong>Inside<\/strong> the actor: synchronous access, no <code>await<\/code>.<\/li><li><strong>Outside<\/strong>: every call needs <code>await<\/code>. Expose <em>methods<\/em>, not settable properties.<\/li><li><strong><code>nonisolated<\/code><\/strong> marks members that don't touch mutable state. It is also how an actor satisfies synchronous protocol requirements such as <code>CustomStringConvertible<\/code> or <code>Hashable<\/code>.<\/li><li>Actors are automatically <code>Sendable<\/code>. They don't support subclassing.<\/li><\/ul>", "say": "<p>\"The <code>await<\/code> outside is honest: the actor might be busy, so you may have to wait your turn. And notice you can't assign to <code>balance<\/code> from outside at all. You go through <code>deposit<\/code>, so the actor stays in control of its invariants. Let's try every rule on a real account.\"<\/p>", "extra": "", "interactiveNote": "<p>Hover over each line to colour it 🟢 <em>inside the actor<\/em> or 🟠 <em>outside<\/em>. The ❌ line shakes and shows the compiler error as a tooltip.<\/p>", "part": 5}, {"kind": "demo", "id": "D4b", "demoId": "4b", "title": "Actor isolation rules", "titleText": "Actor isolation rules", "minutes": 1.0, "files": "<code>Sources/Demos/04_Actors/4b_ActorIsolationRules.swift<\/code>", "concepts": [{"code": "<code>actor BankAccount<\/code> with <code>let iban<\/code> and <code>var balance<\/code>", "say": "Immutable state is readable from outside; mutable state is isolated", "explained": "S23", "refs": ["S23"]}, {"code": "<code>nonisolated var description<\/code>", "say": "No <code>await<\/code> needed, but it can't touch <code>balance<\/code>", "explained": "S23", "refs": ["S23"]}, {"code": "<code>await account.deposit(100)<\/code>, <code>await account.balance<\/code>", "say": "Calls and reads from outside the actor are awaited", "explained": "S22, S23", "refs": ["S22", "S23"]}], "say": "<ol><li>Show <code>BankAccount<\/code>: the actor from the slide, plus an <code>init<\/code>.<\/li><li><p>Run:<\/p><pre class=\"code plain\"><code>CZ12 3456 7890\nAccount CZ12 3456 7890\nBalance: 100<\/code><\/pre><p>🎤 \"<code>iban<\/code> and <code>description<\/code> need no <code>await<\/code>: one is immutable, the other is <code>nonisolated<\/code>. Everything that touches <code>balance<\/code> goes through <code>await<\/code>.\"<\/p><\/li><li><p>Uncomment the <code>❌<\/code> lines one at a time:<\/p><ul><li><p><code>account.deposit(100)<\/code> without <code>await<\/code>:<\/p><blockquote><p><code>Actor-isolated instance method 'deposit' cannot be called from outside of the actor<\/code><\/p><\/blockquote><\/li><li><p><code>await account.balance = 0<\/code>, not even with <code>await<\/code>:<\/p><blockquote><p><code>Actor-isolated property 'balance' can not be mutated from the main actor<\/code><\/p><\/blockquote><\/li><li><p><code>nonisolated func printBalance()<\/code> inside the actor:<\/p><blockquote><p><code>Actor-isolated property 'balance' can not be referenced from a nonisolated context<\/code><\/p><\/blockquote><\/li><\/ul><\/li><li>🎤 \"Every rule from the slide, enforced at compile time.\" Comment the lines out again.<\/li><\/ol>", "part": 5}, {"kind": "slide", "id": "S24", "num": 24, "title": "Actor reentrancy", "titleText": "Actor reentrancy", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>extension BankAccount {                                     // the actor from S23\n    func withdraw(_ amount: Decimal) async -&gt; Bool {\n        guard balance &gt;= amount else { return false }       // ✅ enough money… right now\n        guard await authorize(amount) else { return false } // ⏸ other callers can enter HERE\n        balance -= amount                                   // 💥 the check may no longer be true\n        return true\n    }\n}\n\n// balance 100, two withdrawals of 80 at the same time\nasync let first = account.withdraw(80)\nasync let second = account.withdraw(80)<\/code><\/pre><ul><li><code>authorize(_:)<\/code> pretends to ask the bank: <code>Task.sleep<\/code> for 1 s, then <code>true<\/code>.<\/li><li>At every <code>await<\/code>, the actor <strong>is free to run other calls<\/strong>. After the <code>await<\/code>, state may have changed: <strong>re-check your assumptions.<\/strong><\/li><li>This is not a data race (no simultaneous memory access). It's a <strong>race condition<\/strong>, a logic bug, and <strong>Swift 6 can't catch it<\/strong>.<\/li><li>Reentrancy can also just waste work: three callers asking an image cache for the same image would start three downloads.<\/li><\/ul>", "say": "<p>\"Remember the second card on S6, race condition? Here it is. The account has 100. Two withdrawals of 80 arrive at the same time. The first one checks the balance: 100, fine. Then it asks the bank and suspends, and at that <code>await<\/code> the actor is free again. The second withdrawal checks the balance: still 100, because nothing has been taken out yet! Both get approved, both pay out, and the balance ends at −60. The actor did its job perfectly, so there's no data race. The bug is in our logic.<\/p><p>Why are actors built like this? If an actor stayed locked during <code>await<\/code>, two actors waiting for each other would deadlock, and a slow network call would freeze everyone else. Reentrancy is the price of never deadlocking.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>reentrancy stepper.<\/strong> Two caller lanes (\"withdraw 80\") and the actor in the middle showing <code>balance: 100<\/code>. \"Step\" moves execution forward: caller 1 checks the balance ✅ → hits <code>await<\/code> and leaves the actor → caller 2 enters and checks ✅ → caller 1 pays out (20) → caller 2 pays out (−60, shown in red).<\/p>", "part": 5}, {"kind": "demo", "id": "D4c", "demoId": "4c", "title": "Actor reentrancy", "titleText": "Actor reentrancy", "minutes": 0.5, "files": "<code>Sources/Demos/04_Actors/4c_ActorReentrancy.swift<\/code>. <code>authorize(_:)<\/code> is in <code>Authorize.swift<\/code> in the same folder.", "concepts": [{"code": "<code>exte
