nsion BankAccount { func withdraw … }<\/code>", "say": "Adds a method to the actor from Demo 4b; it has an <code>await<\/code> inside", "explained": "S23, S24", "refs": ["S23", "S24"]}, {"code": "<code>authorize(_:)<\/code>", "say": "Fake bank approval: <code>Task.sleep<\/code> for 1 s, then <code>true<\/code>", "explained": "S24", "refs": ["S24"]}, {"code": "<code>async let first/second = account.withdraw(80)<\/code>", "say": "Two withdrawals at the same time", "explained": "S16", "refs": ["S16"]}, {"code": "<code>await [first, second]<\/code>", "say": "Wait for both", "explained": "S16", "refs": ["S16"]}], "say": "<p>Run:<\/p><pre class=\"code plain\"><code>✅ 80 available – asking the bank…\n✅ 80 available – asking the bank…\n💸 paid out 80 – balance 20\n💸 paid out 80 – balance -60\nApproved: [true, true], balance: -60<\/code><\/pre><p>🎤 \"Look at the first two lines: both withdrawals passed the check before either paid out. The bank just paid out 160 from an account holding 100.\"<\/p>", "part": 5}, {"kind": "slide", "id": "S25", "num": 25, "title": "Fixing reentrancy", "titleText": "Fixing reentrancy", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>extension BankAccount {\n    func withdrawSafely(_ amount: Decimal) async -&gt; Bool {\n        guard balance &gt;= amount else { return false }\n        balance -= amount                     // reserve the money BEFORE the await\n        guard await authorize(amount) else {\n            balance += amount                 // the bank said no → give it back\n            return false\n        }\n        return true\n    }\n}<\/code><\/pre><ul><li>The rule: <strong>update the actor's state before you suspend.<\/strong> Code between two <code>await<\/code>s runs without interruption.<\/li><li>If the operation fails after the <code>await<\/code>, undo the change.<\/li><li>Alternative: check <code>balance<\/code> again after the <code>await<\/code>. That works too, but by then the bank has already approved a payment we won't make.<\/li><\/ul>", "say": "<p>\"The fix: take the money out <em>before<\/em> asking the bank. When the second withdrawal arrives, the balance is already 20, so it's declined straight away. If the bank says no, we put the money back.\"<\/p>", "extra": "", "interactiveNote": "<p>The S24 stepper with a <strong>\"Fixed (reserve first)\"<\/strong> toggle. Step again: caller 1 reserves the money (balance 20) before its <code>await<\/code>, caller 2 enters and is declined ⛔️, and the balance never drops below 20.<\/p>", "part": 5}, {"kind": "demo", "id": "D4d", "demoId": "4d", "title": "Reentrancy fixed", "titleText": "Reentrancy fixed", "minutes": 0.5, "files": "<code>Sources/Demos/04_Actors/4d_ReentrancyFixed.swift<\/code>", "concepts": [{"code": "<code>withdrawSafely(_:)<\/code>: reserve, <code>await<\/code>, roll back on failure", "say": "Change the state before suspending", "explained": "S25", "refs": ["S25"]}, {"code": "The same two <code>async let<\/code> withdrawals", "say": "Same scenario as Demo 4c", "explained": "S16", "refs": ["S16"]}], "say": "<p>Run:<\/p><pre class=\"code plain\"><code>🔒 reserved 80 – asking the bank…\n⛔️ 80 declined – balance is only 20\n💸 paid out 80 – balance 20\nApproved: [true, false], balance: 20<\/code><\/pre><p>🎤 \"Same two withdrawals. The second one sees that the money is already reserved and is declined. The balance can't go negative any more.\"<\/p>", "part": 5}, {"kind": "slide", "id": "S26", "num": 26, "title": "MainActor &amp; global actors", "titleText": "MainActor & global actors", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>@MainActor @Observable\nfinal class GalleryViewModel {\n    var images: [String] = []\n\n    func load() async {\n        let image = try? await api.downloadImage()  // ⏸ main thread is free while waiting\n        images.append(image ?? \"placeholder\")       // back on the main actor: safe UI state\n    }\n}<\/code><\/pre><ul><li><strong><code>MainActor<\/code><\/strong> is a <em>global actor<\/em> that always runs on the main thread.<\/li><li>SwiftUI views, <code>UIViewController<\/code> and <code>UIView<\/code> are all <code>@MainActor<\/code>.<\/li><li>Mark view models <code>@MainActor<\/code> so their state is only touched where the UI reads it.<\/li><li><code>await MainActor.run { … }<\/code> exists, but marking functions <code>@MainActor<\/code> is usually cleaner.<\/li><li>Custom global actors exist (<code>@globalActor actor DatabaseActor { static let shared = … }<\/code>) but are rare.<\/li><\/ul>", "say": "<p>\"For app developers this is the actor you'll use most. The <code>await<\/code> inside <code>load()<\/code> does <em>not<\/em> freeze the UI: while we wait, the main thread is free to draw and scroll. When the download finishes, we continue on the main actor, so updating <code>images<\/code> is safe.\"<\/p>", "extra": "", "interactiveNote": "<p>A phone mockup with a spinner and a scrollable list. Press \"load\": the list stays scrollable during the 2-second wait, then the image pops in. A toggle <strong>\"block main thread instead\"<\/strong> makes the list freeze during the wait.<\/p>", "part": 5}, {"kind": "demo", "id": "D4e", "demoId": "4e", "title": "<code>@MainActor<\/code> view model", "titleText": "@MainActor view model", "minutes": 0.5, "files": "<code>Sources/Demos/04_Actors/4e_MainActorViewModel.swift<\/code>", "concepts": [{"code": "<code>@MainActor final class GalleryViewModel<\/code>", "say": "Everything in it runs on the main actor", "explained": "S26", "refs": ["S26"]}, {"code": "<code>downloadGalleryImage(_:)<\/code>", "say": "The same fake download as <code>downloadImage<\/code>, defined in this file", "explained": "S12", "refs": ["S12"]}, {"code": "<code>printThread(\"…\")<\/code>", "say": "Where are we?", "explained": "S12", "refs": ["S12"]}, {"code": "<code>try?<\/code>", "say": "Turns a thrown error into <code>nil<\/code>", "explained": "", "refs": []}], "say": "<p>Run:<\/p><pre class=\"code plain\"><code>🟢 load() – start → main thread\n🟢 image 7 → main thread\n🟢 load() – after await → main thread\n[\"🖼️7\"]<\/code><\/pre><p>🎤 \"Waited a full second without blocking main, and continued on main, ready to update the UI.\"<\/p>", "part": 5}, {"kind": "slide", "id": "S27", "num": 27, "title": "Actor hopping", "titleText": "Actor hopping", "minutes": 1.0, "timing": "", "annotation": "optional: +1 min", "optional": true, "onHint": "", "html": "<pre class=\"code swift\"><code>@MainActor\nfinal class UsersViewModel {\n    var users: [User] = []\n\n    func loadOneByOne() async {\n        // 🐢 100 hops: main → database → main → database → …\n        for id in 1...50 {\n            let user = await database.loadUser(id: id)\n            users.append(user)\n        }\n    }\n\n    func loadInOneBatch() async {\n        // 🐇 2 hops\n        users = await database.loadUsers(ids: 1...50)\n    }\n}<\/code><\/pre>", "say": "<p>\"Each call into another actor is a potential <em>hop<\/em>, and between the main actor and anything else it's a real thread switch. Usually it doesn't matter. In hot loops, batch the work. Instruments' Swift Concurrency template shows hops if you're curious.\"<\/p>", "extra": "", "interactiveNote": "<p>A dot ping-pongs between a 🟢 MainActor box and a 🟣 Database box, with a hop counter: 100 vs 2.<\/p>", "part": 5}, {"kind": "slide", "id": "S28", "num": 28, "title": "Isolation domains", "titleText": "Isolation domains", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code plain\"><code> ┌──────────────┐     ┌──────────────┐     ┌──────────────┐\n │ 🟢 MainActor │ ←→  │ 🟣 actor A   │ ←→  │ 🔵 concurrent │\n │  UI, VMs     │     │  its state   │     │  code / tasks │\n └──────────────┘     └──────────────┘     └──────────────┘\n          values crossing a boundary must be safe to share<\/code><\/pre><ul><li>Every piece of code runs in an <strong>isolation domain<\/strong>: the main actor, a specific actor instance, or nonisolated/concurrent code.<\/li><li>Inside a domain, only one thing at a time touches its state.<\/li><li>Arguments, return values and captured variables <strong>cross boundaries<\/strong>. Those values must be safe to share.<\/li><\/ul>", "say": "<p>\"Here's the mental model the Swift 6 compiler uses. Think of islands. Each island is safe on its own. The danger is at the bridges: if I hand you a mutable object and we both keep using it from different islands, that's a data race. Demo 3's error was exactly this: the counter tried to cross from the main actor into concurrent child tasks.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>isolation-domain map.<\/strong> Three islands with bridges. Draggable tokens: <code>struct Article<\/code>, <code>final class Draft<\/code>, <code>actor Newsroom<\/code>, <code>@MainActor class ViewModel<\/code>, a closure. Drop a token on a bridge and it shows ✅ \"copied / safe\" or ❌ with the real compiler message.<\/p>", "part": 6}, {"kind": "slide", "id": "S29", "num": 29, "title": "Sendable", "titleText": "Sendable", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>struct Article: Sendable { var title: String }      // ✅ value type, Sendable members\nenum Status: Sendable { case draft, published }     // ✅\nactor Newsroom { }                                  // ✅ actors always are\n@MainActor final class ViewModel { }                // ✅ protected by the main actor\nfinal class Config: Sendable { let url: URL }       // ✅ final + only immutable lets\nfinal class Draft { var title = \"\" }                // ❌ shared mutable reference<\/code><\/pre><ul><li><code>Sendable<\/code> is a protocol with no requirements, a <strong>compile-time marker<\/strong>: \"safe to share across domains\".<\/li><li>Structs and enums with Sendable members are Sendable. For non-public types Swift infers it.<\/li><li><code>@Sendable<\/code> closures may only capture Sendable values.<\/li><\/ul>", "say": "<p>\"You met <code>Sendable<\/code> in Demo 3; here's the full picture. Value types are the easy answer. When you pass a struct, the other side gets its own <em>copy<\/em>, so nothing is shared. Classes are the problem: a reference means shared state. So a class is only Sendable if it's immutable, protected by an actor, or synchronises itself.\"<\/p>", "extra": "", "interactiveNote": "", "part": 6}, {"kind": "demo", "id": "D5a", "demoId": "5a", "title": "What may cross an isolation boundary?", "titleText": "What may cross an isolation boundary?", "minutes": 1.0, "files": "<code>Sources/Demos/05_Sendable/5a_CrossingIsolationBoundaries.swift<\/code>", "concepts": [{"code": "<code>struct Article: Sendable<\/code> sent to <code>actor Newsroom<\/code>", "say": "The actor gets its own copy", "explained": "S28, S29", "refs": ["S28", "S29"]}, {"code": "<code>final class AppConfig: Sendable<\/code> with only <code>let<\/code>s", "say": "An immutable class can be Sendable", "explained": "S29", "refs": ["S29"]}, {"code": "<code>final class MutableConfig: Sendable<\/code> with a <code>var<\/code>", "say": "A mutable class can't", "explained": "S29", "refs": ["S29"]}], "say": "<ol><li>Show <code>Article<\/code> (struct) being published to <code>actor Newsroom<\/code>, then changed locally. Everything compiles. Run: <code>Published<\/code>.<\/li><li><p>Uncomment <code>MutableConfig<\/code>:<\/p><blockquote><p><code>Stored property 'baseURL' of 'Sendable'-conforming class 'MutableConfig' is mutable<\/code><\/p><\/blockquote><p>Comment it out again. Leave the file open for the next slide.<\/p><\/li><\/ol>", "part": 6}, {"kind": "slide", "id": "S30", "num": 30, "title": "<code>sending<\/code>: handing over a non-Sendable value", "titleText": "sending: handing over a non-Sendable value", "minutes": 0.5, "timing": "0.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<pre class=\"code swift\"><code>let article = Article()                 // non-Sendable class\nawait newsroom.publish(article)       // ✅ allowed: draft is handed over…\narticle.title = \"Edited\"              // ❌ …so we can't touch it anymore\n// error: Sending 'draft' risks causing data races<\/code><\/pre>", "say": "<p>\"Swift 6 is smarter than 'classes are never allowed'. If you create an object, hand it over and never touch it again, nothing is shared, so it's safe. The compiler tracks this (<em>region-based isolation<\/em>). Only using it <em>after<\/em> sending is an error.\"<\/p>", "extra": "", "interactiveNote": "", "part": 6}, {"kind": "demo", "id": "D5a-continued", "demoId": "5a, continued", "title": "Handing over a non-Sendable value", "titleText": "Handing over a non-Sendable value", "minutes": 0.5, "files": "<code>Sources/Demos/05_Sendable/5a_CrossingIsolationBoundaries.swift<\/code> (still open)", "concepts": [{"code": "<code>final class ArticleDraft<\/code> (not Sendable)", "say": "A shared mutable reference", "explained": "S29", "refs": ["S29"]}, {"code": "<code>await newsroom.publish(draft)<\/code>, then <code>draft.title = …<\/code>", "say": "Handing over, then touching it again", "explained": "S30", "refs": ["S30"]}], "say": "<ol><li>Point out that <code>await newsroom.publish(draft)<\/code> compiles even though <code>ArticleDraft<\/code> isn't Sendable.<\/li><li><p>Uncomment <code>draft.title = \"Edited\"<\/code>:<\/p><blockquote><p><code>Sending 'draft' risks causing data races<\/code><\/p><\/blockquote><\/li><li>🎤 \"Handing it over is fine. Touching it after the hand-over is not.\" Comment it out again.<\/li><\/ol>", "part": 6}, {"kind": "slide", "id": "S31", "num": 31, "title": "Escape hatches &amp; <code>Mutex<\/code>", "titleText": "Escape hatches & Mutex", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<table><thead><tr><th>Tool<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>@unchecked Sendable<\/code><\/td><td>\"Trust me, I synchronise it myself.\" The compiler stops checking.<\/td><\/tr><tr><td><code>Mutex<\/code> (Synchronization, iOS 18+)<\/td><td>A lock the compiler understands. A class holding a <code>Mutex<\/code> can be plain <code>Sendable<\/code>.<\/td><\/tr><tr><td><code>nonisolated(unsafe) var<\/code><\/td><td>Opts a global/static variable out of checking.<\/td><\/tr><tr><td><code>@preconcurrency import<\/code><\/td><td>Silences diagnostics from libraries not yet updated for Swift 6.<\/td><\/tr><\/tbody><\/table><pre class=\"code swift\"><code>import Synchronization\n\nfinal class MutexCounter: Sendable {          // no @unchecked needed\n    private let value = Mutex(0)              // the Int lives INSIDE the mutex\n\n    func increment() {\n        value.withLock { $0 += 1 }            // only one thread inside at a time\n    }\n}<\/code><\/pre>", "say": "<p>\"Sometimes you know better than the compiler, for example when wrapping an old C library. These are the escape hatches. Every use deserves a comment explaining <em>why<\/em> it's safe, because Demo 3 showed what happens when the promise is a lie.<\/p><p>If you need a small synchronous lock, use <code>Mutex<\/code>. The value lives <em>inside<\/em> the mutex, and the only way to reach it is <code>withLock<\/code>, which lets one thread in at a time. You get the lock <em>and<\/em> keep the compiler checking. Unlike an actor, there's no <code>await<\/code>.\"<\/p>", "extra": "", "interactiveNote": "", "part": 6}, {"kind": "demo", "id": "D5b", "demoId": "5b", "title": "A Sendable class with a Mutex", "titleText": "A Sendable class with a Mutex", "minutes": 0.5, "files": "<code>Sources/Demos/05_Sendable/5b_MutexCounter.swift<\/code>", "concepts": [{"code": "<code>Mutex(0)<\/code>, <code>withLock { $0 += 1 }<\/code>", "say": "Synchronous lock the compiler understands", "explained": "S31", "refs": ["S31"]}, {"code": "Task group loop", "say": "The same 100,000 children as Demo 3", "explained": "S17", "refs": ["S17"]}], "say": "<ol><li>The same 100,000-task loop again, now with <code>MutexCounter: Sendable<\/code>. No <code>@unchecked<\/code>.<\/li><li>Run: <code>Expected 100000, got 100000<\/code><\/li><li>🎤 \"The same loop, three times today. <code>UnsafeCounter<\/code> compiled only with <code>@unchecked<\/code> and was wrong. The actor and the <code>Mutex<\/code> are correct <em>and<\/em> checked by the compiler.\"<\/li><\/ol>", "part": 6}, {"kind": "slide", "id": "S32", "num": 32, "title": "Swift 6 language mode", "titleText": "Swift 6 language mode", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<ul><li><strong>Swift 6 compiler ≠ Swift 6 language mode.<\/strong> The mode is set per target (<code>SWIFT_VERSION<\/code>, or <code>swift-tools-version: 6.x<\/code> in SwiftPM).<\/li><li><strong>Swift 6 mode<\/strong>: complete data-race checking, and violations are <strong>errors<\/strong>.<\/li><li><strong>Swift 5 mode<\/strong>: <em>Strict Concurrency Checking<\/em> = Minimal (default) / Targeted / Complete, reported as <strong>warnings<\/strong>.<\/li><li>⚠️ New app projects in <strong>Xcode 26 and 27 still start in Swift 5 mode.<\/strong> For a new project, switch to Swift 6.<\/li><li>Migrating a big existing project is its own topic: see the swift.org migration guide.<\/li><\/ul>", "say": "<p>\"This trips people up. Installing Xcode with the Swift 6 compiler doesn't turn the checks on. You have to choose the language mode. Everything you saw today was in Swift 6 mode.\"<\/p>", "extra": "", "interactiveNote": "", "part": 6}, {"kind": "slide", "id": "S33", "num": 33, "title": "Why Swift 6.2 changed the defaults", "titleText": "Why Swift 6.2 changed the defaults", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "", "html": "<ul><li>Swift 6 (2024) was <strong>correct but loud<\/strong>. Simple apps got errors about concurrency they weren't even using.<\/li><li>Most app code wants to run on the main thread anyway.<\/li><li><p>Swift 6.2 (2025) introduced <strong>progressive disclosure<\/strong>:<\/p><ol><li>Write ordinary code. It all runs on the <strong>main actor<\/strong>, with no data-race errors.<\/li><li>Add <code>async<\/code>/<code>await<\/code>. Still on the main actor; waiting just doesn't block.<\/li><li>Need performance? <strong>Opt in<\/strong> to parallelism explicitly with <code>@concurrent<\/code>.<\/li><\/ol><\/li><\/ul>", "say": "<p>\"When Swift 6 came out, a beginner writing a to-do app could hit errors about Sendable and actor isolation in code that never ran anything in parallel. The Swift team's answer in 6.2: be single-threaded by default and make concurrency something you opt in to, exactly where you need it.\"<\/p>", "extra": "", "interactiveNote": "", "part": 7}, {"kind": "slide", "id": "S34", "num": 34, "title": "What a new Xcode project turns on", "titleText": "What a new Xcode project turns on", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<table><thead><tr><th>Build setting<\/th><th>New projects<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td><strong>Default Actor Isolation<\/strong> (SE-0466)<\/td><td><code>MainActor<\/code><\/td><td>Unannotated code in the module is <code>@MainActor<\/code>.<\/td><\/tr><tr><td><strong>Approachable Concurrency<\/strong><\/td><td><code>Yes<\/code><\/td><td>Plain async functions run on the caller's actor (SE-0461); isolated conformances are inferred (SE-0470); plus a few smaller Swift 6 features<\/td><\/tr><tr><td><strong>Swift Language Version<\/strong><\/td><td><code>5<\/code> ⚠️<\/td><td>Switch to 6 for full checking.<\/td><\/tr><\/tbody><\/table><p>Two keywords to know:<\/p><ul><li><strong><code>nonisolated<\/code><\/strong> opts out of the main actor (pure logic, models, parsers).<\/li><li><strong><code>@concurrent<\/code><\/strong> runs on the background thread pool (CPU-heavy work).<\/li><\/ul><pre class=\"code swift\"><code>// The same settings in a Swift package\nswiftSettings: [\n    .defaultIsolation(MainActor.self),\n    .enableUpcomingFeature(\"NonisolatedNonsendingByDefault\"),\n    .enableUpcomingFeature(\"InferIsolatedConformances\"),\n]<\/code><\/pre>", "say": "<p>\"If you create an app in Xcode today, these are on. That's why your code 'magically' runs on the main thread, and why <code>@concurrent<\/code> exists. MainActor-by-default is great for app targets. For reusable packages, like a networking layer, many teams keep the old <code>nonisolated<\/code> default.\"<\/p>", "extra": "", "interactiveNote": "", "part": 7}, {"kind": "demo", "id": "D6a", "demoId": "6a", "title": "Who is blocking the main thread?", "titleText": "Who is blocking the main thread?", "minutes": 2.5, "files": "<code>Sources/ApproachableDemos/06_ApproachableConcurrency/6a_WhoIsBlockingTheMainThread.swift<\/code>. This target uses the settings of a new Xcode project.", "concepts": [{"code": "<code>enum HeavyWork<\/code> with no annotation", "say": "In this target, unannotated code is <code>@MainActor<\/code> by default", "explained": "S34", "refs": ["S34"]}, {"code": "<code>nonisolated static func startOnMain()<\/code>", "say": "Not tied to any actor; a synchronous function runs where it's called, here on the main actor", "explained": "S34", "refs": ["S34"]}, {"code": "<code>@concurrent static func startOnBackground()<\/code>", "say": "The same work, but on the background pool", "explained": "S13, S34", "refs": ["S13", "S34"]}, {"code": "<code>startHeartbeat()<\/code>", "say": "Our \"UI\": prints 💓 only while main is free (code below)", "explained": "here", "refs": []}, {"code": "<code>measure(\"…\") { }<\/code>", "say": "How long it took", "explained": "S12", "refs": ["S12"]}], "say": "<p>Show the heartbeat helper first. Every concept in it is already known:<\/p><pre class=\"code swift\"><code>@MainActor\nfunc startHeartbeat() -&gt; Task&lt;Void, Never&gt; {\n    Task {                                    // inherits the main actor (S20)\n        while !Task.isCancelled {             // cooperative cancellation (S19)\n            print(\"   💓\")\n            try? await Task.sleep(for: .milliseconds(250))\n        }\n    }\n}<\/code><\/pre><p>🎤 \"This task lives on the main actor. It can only print a heart when the main actor is free, so treat it as our UI. If the hearts stop, the app is frozen.\"<\/p><ol><li>Show <code>HeavyWork<\/code>: the same CPU-heavy loop (~1 s) twice. <code>startOnMain()<\/code> is a plain <code>nonisolated<\/code> function, so it runs on the main actor when the playground calls it. <code>startOnBackground()<\/code> is <code>@concurrent<\/code>.<\/li><li><p>Run:<\/p><pre class=\"code plain\"><code>   💓\n   💓\n   💓\n   💓\nstart main actor work\n⏱️ main actor: 0.99 s                          ← no 💓 for a whole second = frozen UI\nstart concurrent work\n   💓\n   💓\n   💓\n   💓                                          ← hearts keep beating while we work\n⏱️ @concurrent: 0.98 s<\/code><\/pre><\/li><li>🎤 \"Same work, same duration. The difference is <em>where<\/em> it ran. On main, the UI is frozen for a second. With <code>@concurrent<\/code>, the UI stays alive.\"<\/li><\/ol>", "part": 7}, {"kind": "slide", "id": "S35", "num": 35, "title": "Where does it run?", "titleText": "Where does it run?", "minutes": 1.0, "timing": "1 min", "annotation": "", "optional": false, "onHint": "module with MainActor default isolation", "html": "<pre class=\"code swift\"><code>func plainAsync() async { … }                  // ❓\nnonisolated func nonisolatedAsync() async { … } // ❓\n@concurrent func concurrentAsync() async { … }  // ❓\n\n// all called from the main actor<\/code><\/pre>", "say": "<p>\"The middle one is the interesting one. It's <code>nonisolated<\/code>, yet it runs on main, because it runs on the <em>caller's<\/em> actor. Before Swift 6.2 it would have run in the background. If you read an older article and the behaviour doesn't match, this is usually why.\"<\/p>", "extra": "", "interactiveNote": "<p><strong>\"Where does it run?\" (full version).<\/strong> Two toggles at the top: <em>Default isolation<\/em> <code>MainActor | nonisolated<\/code> and <em>Approachable Concurrency<\/em> <code>on | off<\/code>. Below them, five function signatures (<code>plain<\/code>, <code>nonisolated<\/code>, <code>@concurrent<\/code>, <code>@MainActor<\/code>, actor method), each with a \"guess\" button, then a reveal that shows 🟢 / 🔵 / 🟣. Changing the toggles updates the answers. That shows the pre-6.2 behaviour, and it resolves correction #2 from the old deck.<\/p>", "part": 7}, {"kind": "demo", "id": "D6b", "demoId": "6b", "title": "Quiz: where does it run?", "titleText": "Quiz: where does it run?", "minutes": 0.5, "files": "<code>Sources/ApproachableDemos/06_ApproachableConcurrency/6b_WhereDoesItRun.swift<\/code>", "concepts": [{"code": "plain / <code>nonisolated<\/code> / <code>@concurrent<\/code> async functions", "say": "The three functions from the slide", "explained": "S35", "refs": ["S35"]}, {"code": "<code>Task { }<\/code> vs <code>Task.detached { }<\/code>", "say": "<code>Task<\/code> inherits the caller's actor; <code>Task.detached<\/code> inherits nothing", "explained": "S20", "refs": ["S20"]}, {"code": "<code>await task.value<\/code>", "say": "Wait for both tasks, otherwise the playground ends before they print", "explained": "S19, S20", "refs": ["S19", "S20"]}], "say": "<p>Run:<\/p><pre class=\"code plain\"><code>🟢 plainAsync() → main thread\n🟢 nonisolatedAsync() → main thread\n🔵 concurrentAsync() → background thread #2\n🟢 Task → main thread\n🔵 Task.detached → background thread #2<\/code><\/pre><p>🎤 \"<code>Task { }<\/code> stays on main because it inherits the playground's actor. <code>Task.detached<\/code> doesn't inherit anything, so it lands on the background pool.\"<\/p>", "part": 7}, {"kind": "slide", "id": "S36", "num": 36, "title": "Rules of thumb", "titleText": "Rules of thumb", "minutes": 1.5, "timing": "1.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<ol><li><strong>Start on the main actor.<\/strong> Add concurrency where you <em>measured<\/em> a need.<\/li><li><strong><code>async<\/code> ≠ background.<\/strong> Use <code>@concurrent<\/code> for heavy CPU work.<\/li><li>Prefer <strong>structured<\/strong> concurrency (<code>async let<\/code>, task groups) over <code>Task { }<\/code>. Avoid <code>Task.detached<\/code>.<\/li><li>Move data around as <strong>value types<\/strong> (structs).<\/li><li>Shared mutable state goes in an <strong>actor<\/strong>. Remember <strong>reentrancy<\/strong>.<\/li><li><strong>Never block<\/strong> in async code. No semaphores waiting for async work.<\/li><li><strong>Support cancellation<\/strong> in long-running work.<\/li><li>Every <code>@unchecked Sendable<\/code> needs a comment explaining why it's safe.<\/li><li>New project? Switch to the <strong>Swift 6 language mode<\/strong>.<\/li><\/ol>", "say": "<p>Go through them quickly. Each one maps to a demo they've just seen.<\/p>", "extra": "", "interactiveNote": "", "part": 8}, {"kind": "slide", "id": "S37", "num": 37, "title": "Tools", "titleText": "Tools", "minutes": 0.5, "timing": "0.5 min", "annotation": "", "optional": false, "onHint": "", "html": "<ul><li><strong>Thread Sanitizer<\/strong> (Scheme ▸ Run ▸ Diagnostics) finds data races at runtime, including in legacy and Swift 5 code.<\/li><li><strong>Instruments ▸ Swift Concurrency<\/strong> template shows what tasks and actors are doing over time.<\/li><li><strong>Debugger:<\/strong> task names (<code>Task(name:)<\/code>) and better stepping through async code (Swift 6.2).<\/li><li><strong>Swift Testing:<\/strong> <code>@Test func load() async throws<\/code>. Async tests are first-class.<\/li><\/ul>", "say": "", "extra": "", "interactiveNote": "", "part": 8}, {"kind": "slide", "id": "S38", "num": 38, "title": "Cheat sheet", "titleText": "Cheat sheet", "minutes": 0.16666666666666666, "timing": "", "annotation": "flash it for 10 s; it's a reference for later", "optional": false, "onHint": "", "html": "<table><thead><tr><th>Keyword / API<\/th><th>One-line meaning<\/th><\/tr><\/thead><tbody><tr><td><code>async<\/code><\/td><td>The function can suspend.<\/td><\/tr><tr><td><code>await<\/code><\/td><td>Possible suspension point; the thread isn't blocked.<\/td><\/tr><tr><td><code>Task.sleep(for:)<\/code><\/td><td>Suspend the task for a while; doesn't block.<\/td><\/tr><tr><td><code>async let<\/code><\/td><td>Start a child task now, await the result later.<\/td><\/tr><tr><td><code>withTaskGroup<\/code> / <code>withThrowingTaskGroup<\/code><\/td><td>A dynamic number of child tasks.<\/td><\/tr><tr><td><code>Task { }<\/code><\/td><td>Unstructured task; inherits the actor; <strong>not<\/strong> cancelled with the caller.<\/td><\/tr><tr><td><code>task.value<\/code> / <code>task.cancel()<\/code><\/td><td>Await the result of a task handle / cancel it.<\/td><\/tr><tr><td><code>Task.detached { }<\/code><\/td><td>Inherits nothing; rarely needed.<\/td><\/tr><tr><td><code>Task.checkCancellation()<\/code> / <code>Task.isCancelled<\/code><\/td><td>Cooperative cancellation.<\/td><\/tr><tr><td><code>withCheckedThrowingContinuation<\/code><\/td><td>Wrap a callback API; resume exactly once.<\/td><\/tr><tr><td><code>AsyncStream<\/code>, <code>for await<\/code><\/td><td>Values over time.<\/td><\/tr><tr><td><code>actor<\/code><\/td><td>Reference type that protects its mutable state.<\/td><\/tr><tr><td><code>@MainActor<\/code><\/td><td>Runs on the main thread (UI).<\/td><\/tr><tr><td><code>nonisolated<\/code><\/td><td>Not tied to any actor.<\/td><\/tr><tr><td><code>@concurrent<\/code><\/td><td>Always runs on the background thread pool.<\/td><\/tr><tr><td><code>Sendable<\/code><\/td><td>Safe to share across isolation domains.<\/td><\/tr><tr><td><code>@Sendable<\/code> closure<\/td><td>Captures only Sendable values.<\/td><\/tr><tr><td><code>sending<\/code><\/td><td>A value is handed over and not used by the sender again.<\/td><\/tr><tr><td><code>@unchecked Sendable<\/code><\/td><td>\"Trust me\". The compiler stops checking.<\/td><\/tr><tr><td><code>Mutex<\/code><\/td><td>Synchronous lock the compiler understands (iOS 18+).<\/td><\/tr><\/tbody><\/table>", "say": "", "extra": "", "interactiveNote": "<p>A searchable, filterable card grid. Also offer it as a printable one-page PDF/handout.<\/p>", "part": 8}, {"kind": "slide", "id": "S39", "num": 39, "title": "Resources", "titleText": "Resources", "minutes": 0, "timing": "(shown during Q&A)", "annotation": "", "optional": false, "onHint": "", "html": "<ul><li><em>The Swift Programming Language<\/em>, Concurrency: <a href=\"https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/\" target=\"_blank\" rel=\"noopener\">https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/<\/a><\/li><li>Swift.org, Data-race safety &amp; Swift 6 migration guide: <a href=\"https://www.swift.org/documentation/concurrency/\" target=\"_blank\" rel=\"noopener\">https://www.swift.org/documentation/concurrency/<\/a><\/li><li>WWDC25 <em>Embracing Swift concurrency<\/em>: <a href=\"https://developer.apple.com/videos/play/wwdc2025/268/\" target=\"_blank\" rel=\"noopener\">https://developer.apple.com/videos/play/wwdc2025/268/<\/a><\/li><li>WWDC25 <em>Code-along: Elevate an app with Swift concurrency<\/em>: <a href=\"https://developer.apple.com/videos/play/wwdc2025/270/\" target=\"_blank\" rel=\"noopener\">https://developer.apple.com/videos/play/wwdc2025/270/<\/a><\/li><li>WWDC26 <em>What's new in Swift<\/em>: <a href=\"https://developer.apple.com/videos/play/wwdc2026/262/\" target=\"_blank\" rel=\"noopener\">https://developer.apple.com/videos/play/wwdc2026/262/<\/a><\/li><li>Classic WWDC21 sessions: <em>Meet async/await<\/em>, <em>Explore structured concurrency<\/em>, <em>Protect mutable state with Swift actors<\/em>, <em>Swift concurrency: Behind the scenes<\/em><\/li><li>Swift 6.2 release notes: <a href=\"https://www.swift.org/blog/swift-6.2-released/\" target=\"_blank\" rel=\"noopener\">https://www.swift.org/blog/swift-6.2-released/<\/a><\/li><li>Swift 6.4 release notes: <a href=\"https://www.swift.org/blog/swift-6.4-released/\" target=\"_blank\" rel=\"noopener\">https://www.swift.org/blog/swift-6.4-released/<\/a><\/li><li>Blogs: SwiftLee (avanderlee.com), Donny Wals (donnywals.com), Matt Massicotte (massicotte.org)<\/li><li>Demo code: <code>SwiftConcurrencyDemos/<\/code> (share with the students)<\/li><\/ul>", "say": "", "extra": "", "interactiveNote": "<p>A QR code linking to the demo repository or the slides.<\/p>", "part": 8}, {"kind": "slide", "id": "S40", "num": 40, "title": "Questions? / Thank you", "titleText": "Questions? / Thank you", "minutes": 5, "timing": "0:55–1:00", "annotation": "", "optional": false, "onHint": "", "html": "<p>\"Questions?\", name, contact, QR code.<\/p>", "say": "", "extra": "<p><em>(Optional, outside the 60 minutes: the \"Being a developer / unsolicited recommendations\" slide from the PDF deck.)<\/em><\/p>", "interactiveNote": "", "part": 8}], "compilerMessages": [{"situation": "Non-Sendable class captured in a child task (Demo 3)", "message": "Passing closure as a 'sending' parameter risks causing data races between main actor-isolated code and concurrent execution of the closure"}, {"situation": "Calling an actor method synchronously from outside", "message": "Actor-isolated instance method 'deposit' cannot be called from outside of the actor"}, {"situation": "Mutating actor state from outside (even with `await`)", "message": "Actor-isolated property 'balance' can not be mutated from the main actor"}, {"situation": "`nonisolated` member touching actor state", "message": "Actor-isolated property 'balance' can not be referenced from a nonisolated context"}, {"situation": "Using a value after sending it", "message": "Sending 'draft' risks causing data races"}, {"situation": "Mutable property in a Sendable class", "message": "Stored property 'baseURL' of 'Sendable'-conforming class 'MutableConfig' is mutable"}, {"situation": "`Thread.sleep` in async code", "message": "Class method 'sleep' is unavailable from asynchronous contexts; Use Task.sleep(until:clock:) instead."}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('deck-data').textContent);
const FR = DATA.frames;
const IDX = Object.fromEntries(FR.map((f, i) => [f.id, i]));
const PART = Object.fromEntries(DATA.parts.map(p => [p.n, p]));
const IS_PRESENTER = new URLSearchParams(location.search).has('presenter');
const WIN_ID = Math.random().toString(36).slice(2);
let SCALE = 1, cur = -1, sub = 0, life = null, frameEl = null;

/* planned start (minutes) of every frame; the optional slide is not in the plan */
const PLAN = [];
FR.reduce((acc, f, i) => { PLAN[i] = acc; return acc + (f.optional ? 0 : f.minutes); }, 0);

/* ---------------------------------------------------------------- helpers */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const btn = (label, onclick, cls = '') => h('button', { class: 'btn ' + cls, html: label, onclick });
function seg(options, value, onchange, label) {
  const wrap = h('span', { style: 'display:inline-flex;align-items:center;gap:10px' });
  if (label) wrap.append(h('span', { class: 'seglbl', text: label }));
  const s = h('span', { class: 'seg' });
  const bs = options.map(([v, l]) => h('button', { html: l, onclick: () => { set(v); onchange(v); } }));
  function set(v) { bs.forEach((b, i) => b.classList.toggle('on', options[i][0] === v)); }
  s.append(...bs); wrap.append(s); set(value); wrap.set = set;
  return wrap;
}
function makeLife() {
  const ts = [], is = [], rs = [], ac = new AbortController(); let dead = false;
  return {
    timeout(f, ms) { const id = setTimeout(() => { if (!dead) f(); }, ms); ts.push(id); return id; },
    interval(f, ms) { const id = setInterval(() => { if (!dead) f(); }, ms); is.push(id); return id; },
    raf(f) { const id = requestAnimationFrame(t => { if (!dead) f(t); }); rs.push(id); return id; },
    on(el, ev, fn, opt) { el.addEventListener(ev, fn, Object.assign({ signal: ac.signal }, opt || {})); },
    wait(ms) { return new Promise(r => this.timeout(r, ms)); },
    get dead() { return dead; },
    destroy() { dead = true; ts.forEach(clearTimeout); is.forEach(clearInterval); rs.forEach(cancelAnimationFrame); ac.abort(); }
  };
}
function relPos(el, box) {
  const a = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  return { x: (a.left - b.left) / SCALE, y: (a.top - b.top) / SCALE, w: a.width / SCALE, h: a.height / SCALE };
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const msg = part => (DATA.compilerMessages.find(m => m.message.includes(part)) || {}).message || part;
const fmt = ms => { const neg = ms < 0; ms = Math.abs(ms); const s = Math.floor(ms / 1000); return (neg ? '−' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------------------------------------------------------------- swift highlighting */
const KW = new Set(('actor associatedtype async await break case catch class continue default defer deinit do else enum extension fallthrough false fileprivate final for func get guard if import in init inout internal is let mutating nil nonisolated open operator private protocol public repeat rethrows return self Self set some static struct subscript super switch throw throws true try typealias var weak where while any sending consuming borrowing isolated unowned lazy didSet willSet').split(' '));
function highlightSwift(src) {
  const re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|(@\w+)|(#\w+)|(\b\d[\d_]*(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(src))) {
    const [t, com, str, attr, mac, num, id] = m;
    if (com) out += `<span class="tk-com">${esc(com)}</span>`;
    else if (str) out += `<span class="tk-str">${esc(str)}</span>`;
    else if (attr) out += `<span class="tk-attr">${esc(attr)}</span>`;
    else if (mac) out += `<span class="tk-mac">${esc(mac)}</span>`;
    else if (num) out += `<span class="tk-num">${num}</span>`;
    else if (id) {
      if (KW.has(id)) out += `<span class="tk-kw">${id}</span>`;
      else if (/^[A-Z]/.test(id)) out += `<span class="tk-ty">${id}</span>`;
      else if (src[re.lastIndex] === '(' ) out += `<span class="tk-fn">${id}</span>`;
      else out += id;
    } else out += esc(t);
  }
  return out;
}
function highlightAll(root) {
  root.querySelectorAll('pre.code > code').forEach(c => {
    if (c.dataset.done) return;
    const src = c.textContent, swift = c.parentElement.classList.contains('swift');
    const html = swift ? highlightSwift(src) : esc(src);
    c.innerHTML = html.split('\n').map(l => `<span class="ln">${l || ' '}</span>`).join('\n');
    c.dataset.done = 1;
  });
}

/* ---------------------------------------------------------------- fit content to the stage */
function overflowing(el) {
  if (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) return true;
  return [...el.querySelectorAll('pre')].some(p => p.scrollWidth > p.clientWidth + 1);
}
function shrink(el, min = 0.5) {
  let k = 1; el.style.setProperty('--k', 1);
  while (overflowing(el) && k > min) { k -= 0.03; el.style.setProperty('--k', k.toFixed(2)); }
  return k;
}
function fitContent(el) {
  if (!el || el.dataset.nofit) return;
  const kids = [...el.children];
  const k1 = shrink(el);
  const hasPre = kids.some(c => c.matches('pre')), hasList = kids.some(c => c.matches('ul,ol'));
  if (k1 > 0.86 || !hasPre || !hasList || kids.some(c => c.matches('table')) || el.dataset.nocols) return;
  // try a two-column layout: code left, text right
  const left = h('div', { class: 'col' }), right = h('div', { class: 'col' });
  kids.forEach(c => (c.matches('pre') ? left : right).append(c));
  el.classList.add('cols'); el.append(left, right);
  const k2 = shrink(el);
  if (k2 < k1 + 0.04) { // not better: undo
    el.classList.remove('cols'); el.innerHTML = ''; kids.forEach(c => el.append(c)); shrink(el);
  }
}

/* ---------------------------------------------------------------- agenda track (A1) */
function track(i, big) {
  const parts = DATA.parts.filter(p => p.n >= 1);
  const f = FR[i] || {}, curPart = f.part;
  const el = h('div', { class: 'track' + (big ? ' big' : '') });
  for (const p of parts) {
    const frames = FR.map((x, k) => [x, k]).filter(([x]) => x.part === p.n);
    const state = curPart > p.n ? 'done' : curPart === p.n ? 'cur' : 'future';
    const segEl = h('div', { class: 'tseg ' + state, style: `flex:${big ? 1 : p.minutes}`, title: `${p.n} · ${p.name} (${p.start}–${p.end})`,
      onclick: e => { e.stopPropagation(); go(frames[0][1], 0); } });
    let fill = 0;
    if (state === 'done') fill = 1;
    if (state === 'cur') { const pos = frames.findIndex(([, k]) => k === i); fill = (pos + 1) / frames.length; }
    segEl.append(h('div', { class: 'tfill', style: `transform:scaleX(${fill})` }));
    const short = p.name.replace(/\s*\(.*\)/, '');
    segEl.append(h('div', { class: 'tlabel', html: big ? `${p.n} · ${esc(short)}<small>${p.start}–${p.end}</small>` : `${p.n} ${esc(short)}` }));
    frames.forEach(([x, k], pos) => {
      const left = ((pos + 0.5) / frames.length * 100).toFixed(2) + '%';
      if (k === i && !big) segEl.append(h('span', { class: 'tneedle', style: `left:${left}` }));
    });
    el.append(segEl);
  }
  return el;
}

/* ---------------------------------------------------------------- frame builders */
function partName(f) { const p = PART[f.part]; return p ? (p.n ? `Part ${p.n} · ${p.name}` : p.name) : ''; }

function buildSlide(f, i, L, preview) {
  const el = h('section', { class: 'frame slide', 'data-id': f.id });
  if (f.id === 'S1') return buildTitle(f, el, L, preview);
  const titles = h('div', { class: 'titles' },
    h('div', { class: 'kicker', html: esc(partName(f)) + (f.optional ? '<span class="badge">optional</span>' : '') }),
    h('h1', { html: f.title }));
  const header = h('header', null, titles);
  const content = h('div', { class: 'content', html: f.html });
  el.append(header, content);
  if (IA[f.id]) {
    const tab = h('button', { class: 'ia-tab', html: '✨ Interactive', title: 'Toggle interactive (I)', onclick: () => go(i, sub ? 0 : 1) });
    header.append(tab);
    el.append(h('div', { class: 'ia', hidden: '' }));
  }
  el.append(footer(f, i));
  if (ENH[f.id]) ENH[f.id](content, L, f, preview);
  return el;
}

function footer(f, i) {
  const foot = h('footer');
  const showTrack = i > IDX.S3;
  foot.append(showTrack ? track(i) : h('div', { class: 'track' }));
  foot.append(h('div', { class: 'fid', text: (f.kind === 'demo' ? 'Demo ' + f.demoId : f.id) + `  ·  ${i + 1}/${FR.length}` }));
  return foot;
}

function buildDemo(f, i, L, preview) {
  const el = h('section', { class: 'frame demo', 'data-id': f.id });
  const ps = f.demoId === '3' ? 'Problem → Solution: Demo 3 → S22 → Demo 4a' : f.demoId === '4a' ? 'Problem → Solution: the fix for Demo 3' : '';
  el.append(h('header', null, h('div', { class: 'titles' },
    h('div', { html: `<span class="demo-pill">💻 DEMO ${esc(f.demoId)}</span>` + (ps ? `<span class="ps-banner">${ps}</span>` : '') }),
    h('h1', { html: f.title }))));
  const left = h('div', { class: 'demo-left' });
  const file = h('div', { class: 'demo-file', html: `<span class="lbl">Open in Xcode</span>${f.files}` });
  file.querySelectorAll('code').forEach(c => {
    if (!/\.swift$/.test(c.textContent)) return;
    c.classList.add('path'); c.title = 'Click to copy';
    c.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(c.textContent).catch(() => {}); c.classList.add('copied'); setTimeout(() => c.classList.remove('copied'), 900); };
  });
  file.append(h('div', { class: 'demo-hint', html: 'Switch: <span class="kbd">⌘</span> <span class="kbd">⇥</span> to Xcode · canvas <span class="kbd">⌥⌘↩</span> · come back and press <span class="kbd">→</span>' }));
  left.append(file);
  if (f.concepts.length) {
    const tb = h('table', { class: 'concepts' });
    tb.append(h('tr', null, h('th', { text: '🧰 In the code' }), h('th', { text: 'Say before running' }), h('th', { text: 'Explained on' })));
    for (const c of f.concepts) {
      const ex = h('td');
      if (c.refs.length) c.refs.forEach(r => ex.append(h('button', { class: 'slink', text: r, title: 'Jump to ' + r, onclick: () => go(IDX[r], 0) })));

/* S4 · A2 concurrency vs parallelism */
IA.S4 = (root, L) => {
  const U = 12, COL = { A: 'var(--tA)', B: 'var(--tB)', C: 'var(--tC)' };
  let cores = 1, sched;
  function schedule(n) {
    const rem = { A: 4, B: 4, C: 4 }, order = ['A', 'B', 'C'], slots = []; let rr = 0, t = 0;
    while (Object.values(rem).some(x => x > 0)) {
      const picked = []; let tries = 0;
      while (picked.length < n && tries < 3) { const k = order[rr % 3]; rr++; tries++; if (rem[k] > 0 && !picked.includes(k)) picked.push(k); }
      picked.forEach((k, lane) => { slots.push({ k, t, lane }); rem[k]--; });
      t++;
    }
    return { slots, total: t };
  }
  const area = h('div', { class: 'tl', style: 'margin-top:20px' });
  const total = h('div', { class: 'stat' }), cap = h('div', { class: 'caption' });
  function render(hide) {
    sched = schedule(cores);
    area.innerHTML = '';
    const lanes = h('div', { class: 'lanes' });
    for (let l = 0; l < cores; l++) {
      const tr = h('div', { class: 'ltrack' });
      sched.slots.filter(s => s.lane === l).forEach(s => {
        s.el = h('div', { class: 'tl-block' + (hide ? ' hide' : ''), text: s.k, style: `left:${s.t / U * 100}%;width:${100 / U}%;background:${COL[s.k]}` });
        tr.append(s.el);
      });
      lanes.append(h('div', { class: 'lane' }, h('div', { class: 'lname', text: `CPU core ${l + 1}` }), tr));
    }
    const axis = h('div', { class: 'tl-axis' });
    for (let x = 0; x <= U; x += 2) axis.append(h('span', { style: `left:${x / U * 100}%`, text: x }));
    const cursor = h('div', { class: 'tl-cursor' });

    area.cursor = cursor;
    total.innerHTML = `Total time: <b>${hide ? '…' : sched.total}</b> units`;
    cap.innerHTML = cores === 1 ? '1 core: A, B and C take turns in slices. They <b>overlap in time</b> but never run at the same instant → <b>concurrency</b>.'
      : '2 cores: two tasks run at the <b>same instant</b> → <b>parallelism</b> (and still concurrency). Total time halves.';
  }
  function play() {

    };

  }

  render(false);
};

/* S18 · A9 task tree */
function taskTree(root, L) {
  const area = h('div', { class: 'tree' });
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); area.append(svg);
  const N = {
    root: { label: 'loadScreen()', x: 56, y: 12, kids: ['profile', 'al', 'tg'] },
    profile: { label: 'profile', x: 30, y: 45, parent: 'root', leaf: 1 },
    al: { label: 'async let', x: 53, y: 45, parent: 'root', leaf: 1 },
    tg: { label: 'TaskGroup', x: 79, y: 45, parent: 'root', kids: ['i1', 'i2', 'i3'] },
    i1: { label: 'img1', x: 63, y: 80, parent: 'tg', leaf: 1 },
    i2: { label: 'img2', x: 78.5, y: 80, parent: 'tg', leaf: 1 },
    i3: { label: 'img3', x: 94, y: 80, parent: 'tg', leaf: 1 },
    loose: { label: 'Task { }', x: 9, y: 45, loose: 1 },
  };
  const cap = h('div', { class: 'caption' });
  for (const [k, n] of Object.entries(N)) {
    if (n.parent) { const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); const p = N[n.parent]; l.setAttribute('x1', p.x + '%'); l.setAttribute('y1', p.y + '%'); l.setAttribute('x2', n.x + '%'); l.setAttribute('y2', n.y + '%'); svg.append(l); }
    n.st = h('span', { class: 'st', text: 'running' });
    n.el = h('div', { class: 'tnode' + (n.loose ? ' loose' : ''), style: `left:${n.x}%;top:${n.y}%` }, h('span', { text: n.label }), n.st);
    n.el.append(h('button', { text: '✖', title: 'cancel', onclick: e => { e.stopPropagation(); cancel(k, true); } }));
    if (n.leaf) n.el.append(h('button', { text: '⚡', title: 'throw', onclick: e => { e.stopPropagation(); fail(k); } }));
    area.append(n.el);
  }
  N.loose.st.textContent = 'no parent';
  function set(k, s, label) { const n = N[k]; n.state = s; n.el.classList.remove('cancelled', 'error'); if (s) n.el.classList.add(s); n.st.textContent = label; }
  async function cancel(k, top) {
    if (N[k].state) return;
    set(k, 'cancelled', 'cancelled');
    if (top && k === 'root') cap.innerHTML = 'Cancelling the parent cancels <b>every child</b>. The <code>Task { }</code> isn\'t a child, so it keeps running.';
    else if (top && k !== 'loose') cap.innerHTML = 'Cancellation flows <b>down</b> to the whole subtree.';
    else if (top) cap.innerHTML = 'An unstructured task is only cancelled when <b>you</b> call <code>cancel()</code> on its handle.';
    for (const c of N[k].kids || []) { await L.wait(220); cancel(c, false); }
  }
  async function fail(k) {
    if (N[k].state) return;
    set(k, 'error', '⚡ throws');
    cap.innerHTML = 'The error <b>propagates up</b>; on the way, the siblings are cancelled.';

function toggleHelp() {
  if (!help.hidden) { help.hidden = true; return; }
  help.innerHTML = `<h2 style="margin-top:0">Keyboard</h2><table>
  <tr><td>→ ␣ PgDn</td><td>next (opens the ✨ interactive step first, if the slide has one)</td></tr>
  <tr><td>← PgUp</td><td>previous</td></tr><tr><td>Home / End</td><td>first / last</td></tr>
  <tr><td>I</td><td>toggle the interactive step</td></tr><tr><td>P</td><td>open the presenter view (notes, timers, next slide)</td></tr>
  <tr><td>O</td><td>overview of all slides and demos</td></tr><tr><td>12 ↵</td><td>jump to S12</td></tr>
  <tr><td>F</td><td>fullscreen</td></tr><tr><td>T</td><td>light / dark theme</td></tr><tr><td>B</td><td>black screen</td></tr>
  <tr><td>?</td><td>this help</td></tr></table>`;
  help.hidden = false;
}
let digits = '';
addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape') { overview.hidden = true; help.hidden = true; black.hidden = true; digits = ''; gotoEl.hidden = true; return; }
  if (/^\d$/.test(k)) { digits += k; gotoEl.textContent = 'Go to S' + digits; gotoEl.hidden = false; return; }
  if (k === 'Enter' && digits) { const i = IDX['S' + digits]; digits = ''; gotoEl.hidden = true; if (i != null) go(i, 0); e.preventDefault(); return; }
  if ((k === ' ' || k === 'Enter') && tag === 'button') return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home') go(0, 0);
  else if (k === 'End') go(FR.length - 1, 0);
  else if (k === 'i' || k === 'I') { if (IA[FR[curIdx()].id]) go(curIdx(), curSub() ? 0 : 1); }
  else if (k === 'p' || k === 'P') { if (!IS_PRESENTER) openPresenter(); }
  else if (k === 'o' || k === 'O') toggleOverview();
  else if (k === '?') toggleHelp();
  else if (k === 'f' || k === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  else if (k === 't' || k === 'T') { const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = d; try { localStorage.setItem('scdeck-theme', d); } catch (x) {} if (!IS_PRESENTER) { const c = cur; cur = -1; render(c, sub); } }
  else if (k === 'b' || k === 'B' || k === '.') black.hidden = !black.hidden;
});

/* ---------------------------------------------------------------- boot */
try { const th = localStorage.getItem('scdeck-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
function fromHash() { const [id, s] = location.hash.slice(1).split('/'); return [IDX[id] ?? 0, s === 'i' ? 1 : 0]; }
if (IS_PRESENTER) {
  presenterSetup();
  const [i, s] = fromHash(); pCur = i; pSub = s; presenterRender();
  send({ type: 'hello' });
} else {
  addEventListener('resize', () => { fitStage(); });
  fitStage();
  const [i, s] = fromHash(); render(i, s);
  document.getElementById('navprev').onclick = prev;
  document.getElementById('navnext').onclick = next;
  addEventListener('hashchange', () => { const [i2, s2] = fromHash(); if (i2 !== cur || s2 !== sub) go(i2, s2); });
}
</script>
